<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmukit</title>
<style>
/* ---------------------------------------------------------------- tokens ---- */
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1c1b18; --ink2:#5d5a53; --ink3:#8a867d;
  --line:#dedbd3; --line2:#ebe8e1; --line3:#cfccc4; --soft:#f3f1ec; --softer:#faf9f6;
  --acc:#1f6f9f; --acc-d:#16506f; --acc-bg:#e8f1f7; --acc-line:#bcd7e8;
  --ok:#2f7d4f; --ok-bg:#eef8f1; --ok-line:#bfe0cb;
  --warn:#b7791f; --warn-bg:#fbf5e6; --warn-line:#ecd9a8;
  --bad:#b3362e; --bad-bg:#fdeeec; --bad-line:#efc2bd;
  --gt:#b45309; --code-bg:#1c1b18; --code-ink:#e9e6de;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --panel:#1e1d1a; --ink:#ece9e1; --ink2:#a9a49a; --ink3:#817c73;
    --line:#33312c; --line2:#2a2825; --line3:#454239; --soft:#262420; --softer:#1a1916;
    --acc:#61a8d4; --acc-d:#8cc4e6; --acc-bg:#1b2b36; --acc-line:#2f4c5e;
    --ok:#6fbe8d; --ok-bg:#16291e; --ok-line:#2c4a37;
    --warn:#d8a648; --warn-bg:#2c2517; --warn-line:#4e4123;
    --bad:#e08278; --bad-bg:#2e1a18; --bad-line:#553029;
    --gt:#e3944a; --code-bg:#0f0e0d; --code-ink:#d7d3c9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --panel:#1e1d1a; --ink:#ece9e1; --ink2:#a9a49a; --ink3:#817c73;
  --line:#33312c; --line2:#2a2825; --line3:#454239; --soft:#262420; --softer:#1a1916;
  --acc:#61a8d4; --acc-d:#8cc4e6; --acc-bg:#1b2b36; --acc-line:#2f4c5e;
  --ok:#6fbe8d; --ok-bg:#16291e; --ok-line:#2c4a37;
  --warn:#d8a648; --warn-bg:#2c2517; --warn-line:#4e4123;
  --bad:#e08278; --bad-bg:#2e1a18; --bad-line:#553029;
  --gt:#e3944a; --code-bg:#0f0e0d; --code-ink:#d7d3c9;
  color-scheme:dark;
}
/* ---------------------------------------------------------------- frame ----- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
a{color:var(--acc);cursor:pointer}
.mono{font-family:var(--mono)}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.nav{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.proj{color:var(--ink2);font-size:12.5px;padding-left:12px;border-left:1px solid var(--line);margin-left:4px;font-family:var(--mono)}
.steps{display:flex;gap:2px;margin-left:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;color:var(--ink3);font-size:12.5px;background:none;border:0;cursor:pointer;font-family:inherit}
.step:hover{background:var(--soft)}
.step.cur{background:var(--acc-bg);color:var(--acc);font-weight:600}
.step .n{width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono)}
.step.done{color:var(--ink)}.step.done .n{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.navr{margin-left:auto;display:flex;gap:12px;color:var(--ink3);font-size:12px;align-items:center}
.main{flex:1;display:flex;gap:14px;padding:14px 16px 14px;min-height:0;align-items:stretch;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px;min-width:340px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line2);font-weight:600;font-size:13px;flex:none;flex-wrap:wrap}
.ph .sub{font-weight:400;color:var(--ink3);font-size:12px}
.pb{padding:12px 13px;overflow:auto;flex:1;min-height:0}
.pb.flush{padding:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.sel>td{background:var(--acc-bg)}
.t tr.click{cursor:pointer}.t tr.click:hover>td{background:var(--soft)}
.t tr.sel.click:hover>td{background:var(--acc-bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;line-height:16px}
.b-ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.b-warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.b-bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.b-mute{color:var(--ink3);border-color:var(--line);background:var(--soft)}
.b-acc{color:var(--acc);border-color:var(--acc-line);background:var(--acc-bg)}
.b-ink{color:var(--ink);border-color:var(--line3);background:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:4px;border:1px solid var(--line3);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--acc-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line3);background:var(--panel);color:var(--ink);font-size:12px;cursor:pointer;font-family:var(--mono)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:5px 12px;font-size:12.5px}
.kv .k{color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.inp{height:28px;border:1px solid var(--line3);border-radius:4px;padding:0 8px;font:inherit;background:var(--panel);color:var(--ink)}
.hint{color:var(--ink3);font-size:12px}
.inp.bad{border-color:var(--bad);background:var(--bad-bg)}
.fielderr{color:var(--bad);font-size:12px}
/* the screen's actions stay on screen however long the screen is (Model scrolls) */
.foot{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);flex:none;flex-wrap:wrap;position:sticky;bottom:0;z-index:5}
.stat{display:flex;flex-direction:column;gap:2px;padding:0 16px 0 0;margin-right:16px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.callout{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--softer);font-size:12.5px}
.callout.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.callout.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.trust .box{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel)}
.trust .h{font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.code{font-family:var(--mono);font-size:11.5px;background:var(--code-bg);color:var(--code-ink);padding:10px 12px;border-radius:4px;white-space:pre;overflow:auto;line-height:1.5}
.code.wrap{white-space:pre-wrap}
.code .e{color:#e3944a}.code .a{color:#7fb98b}.code .d{color:#d98b84}.code .c{color:#8a867d}
.md{font-size:13px;line-height:1.55;overflow:auto;overflow-wrap:anywhere}
.md h1{font-size:16px;margin:4px 0 10px}.md h2{font-size:14px;margin:16px 0 8px}.md h3,.md h4{font-size:13px;margin:12px 0 6px}
.md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px;padding-left:20px}.md li{margin:2px 0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--line2);padding:0 3px;border-radius:3px}
.md table.t{margin:0 0 12px}.md table.t td{vertical-align:top}.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line2)}
.seg{height:100%}
.grid{display:grid;gap:4px;min-width:0}
.cell{height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--mono)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
/* grid markers: "h" = the grade is held for a reason, "off" = a default-off block is graded worse */
.cell{position:relative;gap:4px}
.cell .gm{font-size:9px;font-weight:600;line-height:1;padding:1px 3px;border-radius:2px;border:1px solid currentColor;opacity:.85;font-style:normal}
.cell .gm.off{color:var(--ink3)}
/* panels that must never scroll sideways: fixed table layout, long values wrap */
.noxs{overflow-x:hidden}
table.t.fixed{table-layout:fixed}
.t.fixed th{white-space:normal;overflow-wrap:normal;padding:6px 5px}
.t.fixed td{padding-left:5px;padding-right:5px}
.t.fixed td{overflow-wrap:anywhere}
.t.fixed td.num{white-space:normal}
.t.fixed td.val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t tr.why>td{padding:0 8px 7px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.t tr.haswhy>td{border-bottom:0;padding-bottom:3px}
.t tr.why .full{margin-top:3px;color:var(--ink3)}
.kv.wrap{grid-template-columns:minmax(80px,120px) minmax(0,1fr)}
.kv.wrap>span{min-width:0;overflow-wrap:anywhere}
.cellchart>:first-child{margin-top:0!important}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.c-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.c-mute{background:var(--soft);color:var(--ink3);border-color:var(--line)}
.c-acc{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-line)}
.c-head{background:transparent;color:var(--ink2);font-size:10.5px;cursor:default;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);margin:0}
.rc{cursor:context-menu}
/* ------------------------------------------------------------- overlays ----- */
.veil{position:fixed;inset:0;z-index:40}
.ctx{position:fixed;z-index:41;min-width:230px;max-width:360px;background:var(--panel);border:1px solid var(--line3);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:4px;font-size:12.5px}
.ctx .ttl{padding:5px 10px 6px;color:var(--ink3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .it{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;background:none;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.ctx .it:hover:not(:disabled){background:var(--acc-bg);color:var(--acc)}
.ctx .it:disabled{color:var(--ink3);opacity:.55;cursor:default}
.ctx .it .k{color:var(--ink3);font-family:var(--mono);font-size:11px}
.ctx .sep{height:1px;background:var(--line2);margin:3px 6px}
.cli{display:flex;align-items:center;gap:10px;padding:5px 16px;background:var(--softer);border-top:1px solid var(--line2);font-size:12px;flex:none;min-height:30px}
.cli .d{color:var(--ink3);font-family:var(--mono)}
.cli .c{font-family:var(--mono);color:var(--ink);overflow:auto;white-space:nowrap;flex:1}
.help{position:fixed;z-index:41;right:16px;top:56px;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 120px);background:var(--panel);border:1px solid var(--line3);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;flex-direction:column}
.keys{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:12.5px}
.kb{font-family:var(--mono);font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:1px 6px;display:inline-block}
.err{border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-bottom:12px}
.err .t{font-weight:600;color:var(--bad);display:flex;gap:8px;align-items:center}
.err .k{color:var(--ink2);width:56px;display:inline-block;flex:none}
.err .row{display:flex;gap:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);padding:36px 20px;text-align:center}
.empty .t{font-weight:600;color:var(--ink)}
.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--line2),var(--soft),var(--line2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.q{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid var(--line3);color:var(--ink3);font-size:10px;align-items:center;justify-content:center;margin-left:6px;cursor:help;vertical-align:middle}
.prog{display:flex;align-items:center;gap:10px;padding:7px 13px;border:1px solid var(--acc-line);background:var(--acc-bg);border-radius:4px;font-size:12.5px;margin-bottom:12px}
.prog .bar{flex:1;max-width:260px}
.pal{position:fixed;z-index:42;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line3);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.28);overflow:hidden}
.pal input{width:100%;height:40px;border:0;border-bottom:1px solid var(--line2);padding:0 14px;font:inherit;font-size:14px;background:var(--panel);color:var(--ink)}
.pal input:focus{outline:none}
.pal .list{max-height:44vh;overflow:auto;padding:4px}
.pal .it{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:3px;cursor:pointer;background:none;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.pal .it.on,.pal .it:hover{background:var(--acc-bg);color:var(--acc)}
svg.chart{display:block;width:100%;height:auto;font-family:var(--mono);font-size:10px}
.drop{border:1.5px dashed var(--line3);border-radius:6px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink2);padding:18px;text-align:center}
.drop.over{border-color:var(--acc);background:var(--acc-bg)}
.rowflex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
@media (max-width:1100px){.col{min-width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="nav" id="nav"></div>
  <div class="main" id="main"></div>
  <div class="cli" id="cli"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="overlays"></div>
<script>
"use strict";
/* =========================================================================
   pmukit web shell -- one page, eight screens, no framework and no build.
   Everything the page knows comes from the routes in docs/OVERNIGHT_BRIEF.md.
   ========================================================================= */

/* --------------------------------------------------------------- state --- */
var S = {
  screen: "home",
  project: "",
  demo: false,
  data: {},          /* cache key -> payload                                */
  loading: {},       /* cache key -> true while in flight                   */
  slow: {},          /* cache key -> true after 2 s (the "what is happening")*/
  failed: {},        /* cache key -> {screen, status, error}: not asked again */
  errs: {},          /* screen   -> {status, error, retry}                  */
  sel: {},           /* per-screen selections                               */
  menu: null,
  help: null,
  note: null,        /* {title, lines}: an explanation popover, not a dialog    */
  palette: false,
  job: null,         /* {job, status, message, progress, title, screen}     */
  progress: {},      /* step -> true when done on disk (GET /api/state)      */
  undoable: "",
  toast: "",
  prev: "home"       /* the screen Settings goes back to                    */
};

var ICON = {
  ok: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>',
  warn: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5l6 11H2z"/><path d="M8 7v3"/><path d="M8 12.2v.1"/></svg>',
  x: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  file: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/></svg>',
  play: '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',
  copy: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>',
  retry: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg>',
  arrow: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>',
  up: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3.5M4.5 7L8 3.5 11.5 7"/><path d="M2.5 11.5v2h11v-2"/></svg>'
};

var STEPS = [["0","Home","home"],["1","New","new"],["2","Plan","plan"],["3","Run","run"],
             ["4","Model","model"],["5","Deliver","deliver"]];
/* The Settings fields each engine actually reads (site.py); an engine not listed reads none. */
var SITE_FIELDS = {
  donau_alps: ["simulator", "queue", "cpus", "accounts"],
  spectre_ssh: ["ssh_host", "remote_workdir", "spectre_cmd"]
};

/* ------------------------------------------------------------- helpers --- */
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function el(id){ return document.getElementById(id); }
function num(x, d){ d = d === undefined ? 2 : d; var v = Number(x); return isFinite(v) ? v.toFixed(d) : "-"; }
function eng(x, unit){
  unit = unit || "";
  var v = Number(x);
  if (!isFinite(v) || v === 0) return "0 " + unit;
  var sign = v < 0 ? "-" : ""; v = Math.abs(v);
  var tab = [[12,"T"],[9,"G"],[6,"M"],[3,"k"],[0,""],[-3,"m"],[-6,"u"],[-9,"n"],[-12,"p"],[-15,"f"]];
  for (var i = 0; i < tab.length; i++){
    if (v >= Math.pow(10, tab[i][0]) || tab[i][0] === -15){
      var s = (v / Math.pow(10, tab[i][0])).toPrecision(4).replace(/\.?0+$/,"");
      return (sign + s + " " + tab[i][1] + unit).trim();
    }
  }

  if (s < 5400) return Math.round(s/60) + " min ago";

/* Typed numbers. Engineering suffixes as Spectre writes them plus the page's own display
   (M = mega, as eng() prints it; m = milli; meg = mega too), an optional unit after it. A
   token that is not a number is named back to the user -- never read as 0, never dropped. */
var ENG_MULT = { T:1e12, G:1e9, M:1e6, meg:1e6, k:1e3, "":1, m:1e-3, u:1e-6, "µ":1e-6,
                 n:1e-9, p:1e-12, f:1e-15 };
function readEng(text, unit, what){
  var t = String(text === null || text === undefined ? "" : text).trim();
  if (!t) return { bad: "type " + (what || "a value") + " first" };
  var m = t.match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*(meg|Meg|MEG|[TGMkmunpfµ])?\s*([A-Za-z]*)$/);
  if (!m || (m[3] && (!unit || m[3].toLowerCase() !== unit.toLowerCase()))){
    return { bad: '"' + t + '" is not ' + (what || "a number") + (unit ? " in " + unit : "")
                  + ": write e.g. " + (unit === "Hz" ? "20G or 2e10" : unit === "A" ? "500u or 5e-4" : "0.4 or 400m") };
  }

  if (!toks.length) return { bad: "type at least one " + (what || "value") + ", e.g. 3 or 1,3,5" };
  var out = [];
  for (var i = 0; i < toks.length; i++){
    if (!/^[-+]?\d+$/.test(toks[i])){
      return { bad: '"' + toks[i] + '" is not an integer ' + (what || "value") + " (codes are whole numbers, e.g. 1,3,5)" };
    }
    var n = parseInt(toks[i], 10);

/* ----------------------------------------------------------------- api --- */
function api(path, opts){
  opts = opts || {};
  var init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined){
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  return fetch(path, init).then(function(r){
    return r.text().then(function(txt){
      var data = null;
      try { data = txt ? JSON.parse(txt) : {}; } catch(e){ data = { raw: txt }; }
      if (!r.ok){
        var e4 = (data && data.error) || {
          what: "the server answered " + r.status + " for " + path + ".",
          why: "The response carried no four-part error, which means it did not come from a "
             + "pmukit route handler.",
          do: ["Reload the page", "Check the server console"],
          where: path
        };
        throw { status: r.status, error: e4, path: path };
      }
      return data;
    });
  }, function(netErr){
    throw { status: 0, path: path, error: {
      what: "the page could not reach the pmukit server.",
      why: "fetch(" + path + ") failed: " + netErr + ". The server process is gone, or the "
         + "machine went to sleep while the page stayed open.",
      do: ["Restart `pmukit ui` in the terminal", "Reload the page"],
      where: path } };
  });
}

/* A cached GET tied to a screen. Renders skeletons while in flight, a four-part error on
   failure, and marks the request "slow" after 2 s so the screen can say what it is doing.
   A failure is remembered per key and NOT asked again on the next render -- every render
   would otherwise re-request it (hundreds a second) and rebuild the page under the cursor.
   It is asked again only when the user acts: Try again, going to a screen, a reload, or a
   forget() by whatever changed the answer (a netlist load, a saved config). */
function need(key, path, screen){
  if (S.data[key] !== undefined || S.loading[key]) return S.data[key];
  if (S.failed[key]){
    if (!S.errs[screen]) S.errs[screen] = failErr(key, screen);   /* still unresolved: say so */
    return undefined;
  }
  S.loading[key] = true;
  var timer = setTimeout(function(){ S.slow[key] = true; render(); }, 2000);
  api(path).then(function(d){
    clearTimeout(timer);
    S.loading[key] = false; S.slow[key] = false; S.data[key] = d;
    delete S.failed[key];
    if (S.errs[screen] && S.errs[screen].key === key) delete S.errs[screen];
    render();
    scheduleCli();      /* the strip is built from this data (a reload has none until now) */
  }, function(e){
    clearTimeout(timer);
    S.loading[key] = false; S.slow[key] = false;
    S.failed[key] = { screen: screen, status: e.status, error: e.error };
    /* an error an action put up (a refused netlist, say) stays: it names what was tried */
    if (!S.errs[screen] || S.errs[screen].key) S.errs[screen] = failErr(key, screen);
    render();
  });
  return undefined;
}
function failErr(key, screen){
  var f = S.failed[key];
  return { status: f.status, error: f.error, key: key,
           retry: function(){ unfail(screen); delete S.data[key]; delete S.errs[screen]; render(); } };
}
/* Forget the failures of one screen (all of them, or every screen): the next render asks again. */
function unfail(screen){
  Object.keys(S.failed).forEach(function(k){
    if (!screen || S.failed[k].screen === screen) delete S.failed[k];
  });
}
function forget(prefix){
  Object.keys(S.data).forEach(function(k){ if (k.indexOf(prefix) === 0) delete S.data[k]; });
  Object.keys(S.loading).forEach(function(k){ if (k.indexOf(prefix) === 0) delete S.loading[k]; });
  Object.keys(S.failed).forEach(function(k){ if (k.indexOf(prefix) === 0) delete S.failed[k]; });
}

/* ---------------------------------------------------------------- jobs --- */
/* A job strip belongs to the screen that started it (after onStart, which may move to the screen
   that watches it -- Submit goes to Run). While it works it shows everywhere; once finished it
   shows only there, and a success clears itself after JOB_DONE_MS. */
var JOB_DONE_MS = 4000;
function startJob(promise, title, onDone, onStart){
  promise.then(function(d){
    if (!d || !d.job){ if (onDone) onDone(d); render(); return; }
    S.job = { job: d.job, status: "running", progress: 0, message: "starting", title: title };
    if (onStart) onStart(d);
    S.job.screen = S.screen;
    render();
    poll(d.job, onDone);
  }, function(e){ showErr(e); });
}
function poll(id, onDone){
  api("/api/jobs/" + encodeURIComponent(id)).then(function(j){
    var owner = (S.job && S.job.job === id && S.job.screen) || S.screen;
    S.job = { job: j.job, status: j.status, progress: j.progress, message: j.message,
              title: j.title, error: j.error, not_landed: j.not_landed, result: j.result,
              error_kind: jobErrKind(j), screen: owner };
    render();
    if (j.status === "running" || j.status === "queued"){ setTimeout(function(){ poll(id, onDone); }, 700); return; }
    if (j.status === "failed"){
      /* the error is shown ONCE, as the four-part banner of the screen that started the job */
      S.errs[owner] = { status: jobErrChip(j), kind: jobErrKind(j), error: j.error,
                        retry: function(){ S.job = null; render(); } };
    }
    loadProgress();
    if (j.status === "done"){
      setTimeout(function(){
        if (S.job && S.job.job === id && S.job.status === "done"){ S.job = null; render(); }
      }, JOB_DONE_MS);
    }
    if (onDone) onDone(j);
    render();
  }, function(e){ showErr(e); });
}
/* What kind of failure a finished job is -- the server says (error_kind); a server older than
   that is read from not_landed. "refused" is the input being turned down, not a fault. */
function jobErrKind(j){
  if (!j || j.status !== "failed") return "";
  return j.error_kind || (j.not_landed ? "not_landed" : "");
}
/* The status chip of a failed job's banner: the status the same failure gets as a route answer
   (501 a module not landed, 500 a crash). A plain refusal carries no chip -- it is not a code
   worth reading, and "501" (not implemented) on a refused netlist was simply wrong. */
function jobErrChip(j){
  var kind = jobErrKind(j);
  if (kind === "refused") return 0;
  return j.error_status || (kind === "not_landed" ? 501 : 0);
}
function showErr(e){
  S.errs[S.screen] = { status: e.status, error: e.error,
                       retry: function(){ delete S.errs[S.screen]; render(); } };
  render();
}
/* An action on `screen` just succeeded: the error an EARLIER action put up there (a refused
   netlist, a rejected save) is history now, and so is the failed job strip that pointed at it.
   A failed GET (need(), which carries its key) is left alone -- it clears itself the moment
   that data loads. Nothing changed, nothing cleared: only a success calls this. */
function settled(screen){
  var e = S.errs[screen];
  if (e && !e.key) delete S.errs[screen];
  if (S.job && S.job.status === "failed" && (!S.job.screen || S.job.screen === screen)) S.job = null;
}

}

/* Menu: every verb of the object. */
function openMenu(ev, kind, title, ctx){
  ev.preventDefault(); ev.stopPropagation();
  S.menu = { kind: kind, title: title, ctx: ctx, x: ev.clientX, y: ev.clientY };
  render();
}
function rc(kind, title, ctxName){
  /* the attributes that wire one object to its context menu. No class: the caller owns the
     class attribute, and two class attributes on one tag would silently lose the first. */
  return ' data-menu="' + esc(kind) + '" data-menutitle="' + esc(title)
       + '" data-menuctx="' + esc(ctxName) + '"';
}

/* Action registry: HTML strings cannot carry closures, so handlers are registered per render. */
var ACTS = {}, ACTN = 0;
function regAction(fn){ var id = "a" + (++ACTN); ACTS[id] = fn; return id; }
var CTXS = {}, CTXN = 0;
function regCtx(obj){ var id = "c" + (++CTXN); CTXS[id] = obj; return id; }

/* ------------------------------------------------------------ navigation - */
function go(screen){
  /* Settings is the machine's, not a step of the project: it remembers where it was opened
     from, and it is never written into the project's state.json. */
  if (screen === "settings" && S.screen !== "settings") S.prev = S.screen;
  S.screen = screen;
  delete S.errs[screen];
  unfail();                 /* going somewhere is asking again, once */
  if (S.project && !S.demo && screen !== "settings"){
    api("/api/state/" + P(), { method:"PUT", body:{ screen: screen } }).then(function(){}, function(){});
  }
  syncUrl();
  render();
  refreshCli();
}
/* The address says where the page is, so a reload comes back to this project and screen -- and
   on Model to the grid cell and the block row that were open:
   ?project=p&screen=model&cell=<port>|<corner>/<temp>C&block=<block>|<cell_key> */
function urlQuery(){
  var q = "?project=" + P() + "&screen=" + encodeURIComponent(S.screen);
  if (S.screen === "model" && S.sel.port){
    q += "&cell=" + encodeURIComponent(S.sel.port + "|" + (S.sel.cell || S.sel.corner || ""));
    if (S.sel.block) q += "&block=" + encodeURIComponent(S.sel.block
                                                         + (S.sel.blockCell ? "|" + S.sel.blockCell : ""));
  }
  return q;
}
function syncUrl(){
  try {
    if (S.project && window.history && window.history.replaceState){
      window.history.replaceState(null, "", urlQuery());
    }
  } catch(e){ /* a sandboxed page: the server-side state still remembers */ }
}
/* ?cell= / ?block= back into the Model selection (the inverse of urlQuery). */
function restoreCell(cell, block){
  var i = String(cell || "").indexOf("|");
  if (i <= 0) return;
  var port = cell.slice(0, i), rest = cell.slice(i + 1);
  var m = rest.match(/^([^\/]*)(?:\/(.+)C)?$/);
  if (!m || !m[1]) return;
  S.sel.port = port; S.sel.corner = m[1];
  S.sel.temp = m[2] === undefined ? "" : m[2];
  S.sel.cell = rest;
  S.sel.block = null; S.sel.blockCell = null;
  if (block){
    var j = block.indexOf("|");
    S.sel.block = j < 0 ? block : block.slice(0, j);
    S.sel.blockCell = j < 0 ? null : block.slice(j + 1);
  }
}
function openProject(name, screen){
  S.project = name;
  S.data = {}; S.loading = {}; S.failed = {}; S.errs = {}; S.sel = {}; S.progress = {};
  go(screen || "new");
  loadProgress();
}
/* The steps this project has DONE (GET /api/state: config, ledger rows, results, a fit, a
   deliverable), for the nav circles -- read from the server, so a reload shows them again. */
function loadProgress(then){
  if (!S.project) return;
  var p = S.project;
  api("/api/state/" + P()).then(function(st){
    if (p !== S.project) return;
    S.progress = (st && st.progress) || {};
    if (then) then(st || {});
    render();
  }, function(){});
}
/* New project: the name field in the Home footer. This fills and focuses it; Enter or the
   button creates the folder. A refusal (bad name, already there) is shown next to the field. */
function newProject(suggested){
  if (S.screen !== "home") go("home");
  if (suggested) S.sel.newName = suggested;
  S.sel.newErr = null;
  render();
  var n = el("newname");
  if (n && n.focus){ n.focus(); if (n.select) n.select(); }
}
function createProject(){
  var n = el("newname");
  var name = String(n ? n.value : (S.sel.newName || "")).trim();
  S.sel.newName = name;
  if (!name){
    S.sel.newErr = { what: "type a name for the project first.",
      why: "A project is a folder under PMUKIT_DATA; the name is the folder's name.",
      do: ["Use a name like demo_pmu"], where: "Home > new project name" };
    render(); return;
  }
  api("/api/projects", { method:"POST", body:{ name: name } }).then(function(d){
    S.sel.newName = ""; S.sel.newErr = null;
    forget("projects");
    openProject(d.project, "new");
  }, function(e){ S.sel.newErr = e.error; render(); });
}
/* Open the latest deliverable's report.md. With nothing delivered yet the Deliver screen says
   so and offers to deliver. */
function openReport(name){
  if (name && name !== S.project) openProject(name, "deliver"); else go("deliver");
  S.sel.deliv = 0; S.sel.file = "report.md"; S.sel.wantReport = true;
  forget("deliverables"); forget("dfile:");
  render(); refreshCli();
}

/* ------------------------------------------------------------- rendering - */
function render(){
  /* A field marked data-keepfocus keeps the cursor across a re-render (a job poll or a probe
     landing must not steal the name being typed). */
  var ae = document.activeElement;
  var keep = ae && ae.getAttribute && ae.getAttribute("data-keepfocus") ? ae.id : "";
  var caret = keep ? ae.selectionStart : 0, caretEnd = keep ? ae.selectionEnd : 0;
  ACTS = {}; CTXS = {};
  renderNav();
  var sc = SCREENS[S.screen] || SCREENS.home;
  el("main").innerHTML = sc.main();
  el("foot").innerHTML = sc.foot ? sc.foot() : "";
  renderCli();
  renderOverlays();
  wire();
  var kn = keep ? el(keep) : null;
  if (kn && kn.focus){ kn.focus(); try { kn.setSelectionRange(caret, caretEnd); } catch(e){ /* not a text field */ } }
}
function renderNav(){
  var steps = STEPS.map(function(s, i){
    var cur = S.screen === s[2];
    var idx = STEPS.map(function(x){ return x[2]; }).indexOf(S.screen);
    var cls = cur ? "step cur" : (idx > i || (S.progress || {})[s[2]] ? "step done" : "step");
    /* the accessible name is the screen's name; the digit is the shortcut, said in the title */
    return '<button class="' + cls + '" data-go="' + s[2] + '" aria-label="' + s[1] + '"'
         + (cur ? ' aria-current="page"' : "") + ' title="' + s[1] + " (key " + s[0] + ')">'
         + '<span class="n" aria-hidden="true">' + s[0] + "</span><span>" + s[1] + "</span></button>";
  }).join("");
  var extra = "";
  if (S.screen === "digest") extra = '<span class="badge b-acc">4b Copy for desk</span>';
  if (S.screen === "states") extra = '<span class="badge b-mute">reference sheet</span>';
  if (S.screen === "settings") extra = '<span class="badge b-mute">this machine, every project</span>';
  el("nav").innerHTML =
      '<button class="brand" data-go="home" aria-label="pmukit Home" title="Home: every project (key 0)">pmukit</button>'
    + '<span class="proj">' + esc(S.project || "no project") + (S.demo ? " &middot; demo" : "") + "</span>"
    + '<div class="steps">' + steps + "</div>"
    + '<div class="navr">' + extra
    + (S.toast ? '<span class="badge b-ok">' + esc(S.toast) + "</span>" : "")
    + '<span class="hint">' + (S.undoable ? "Ctrl Z undoes: " + esc(S.undoable) : "") + "</span>"
    + '<button class="btn sm' + (S.screen === "settings" ? " pri" : "") + '" data-go="settings" '
    + 'title="Where runs go: engine, simulator, queue, CPUs and the Donau accounts of this machine">Settings</button>'
    + '<button class="btn sm" data-help="1" title="Help and keyboard shortcuts (?)">? Help</button>'
    + "</div>";
}
function renderCli(){
  el("cli").innerHTML = '<span class="d">$</span><span class="c">' + esc(S.cli || "pmukit")
    + '</span><button class="btn sm" data-copycli="1">' + ICON.copy + " Copy</button>"
    + '<span class="hint">every action on this screen has this command</span>';
}
function renderOverlays(){
  var out = "";
  if (S.menu){
    var mctx = S.menu.ctx, mkind = S.menu.kind;
    var items = verbsFor(mkind, mctx).map(function(v){
      if (v.sep) return '<div class="sep"></div>';
      var id = regAction(function(){ S.menu = null; v.run(mctx); });
      return '<button class="it" data-act="' + id + '"><span>' + esc(verbLabel(v, mctx))
           + '</span><span class="k">' + esc(v.key || "") + "</span></button>";
    }).join("");
    var x = Math.min(S.menu.x, Math.max(8, window.innerWidth - 360));
    var y = Math.min(S.menu.y, Math.max(8, window.innerHeight - 40 - 30 * verbsFor(S.menu.kind, S.menu.ctx).length));
    out += '<div class="veil" data-close="menu"></div><div class="ctx" style="left:'
        + Math.max(4, x) + "px;top:" + Math.max(4, y) + 'px"><div class="ttl">'
        + esc(S.menu.title) + "</div>" + items + "</div>";
  }
  if (S.help){
    var h = S.help;
    out += '<div class="veil" data-close="help"></div><div class="help"><div class="ph"><span>'
        + esc(h.title || "Help") + '</span><button class="btn sm" data-close="help">Close &middot; Esc</button></div>'
        + '<div class="pb" style="display:flex;flex-direction:column;gap:12px">'
        + '<div><div class="lbl" style="margin-bottom:6px">This screen</div>'
        + (h.lines || []).map(function(l){ return '<div style="margin-bottom:5px;line-height:1.5">' + esc(l) + "</div>"; }).join("")
        + "</div>"
        + ((h.keys && h.keys.length) ? '<div><div class="lbl" style="margin-bottom:6px">Keys here</div><div class="keys">'
            + h.keys.map(function(k){ return "<span><span class=\"kb\">" + esc(k[0]) + "</span></span><span>" + esc(k[1]) + "</span>"; }).join("")
            + "</div></div>" : "")
        + '<div><div class="lbl" style="margin-bottom:6px">Everywhere</div><div class="keys">'
        + (h.global_keys || []).map(function(k){ return "<span><span class=\"kb\">" + esc(k[0]) + "</span></span><span>" + esc(k[1]) + "</span>"; }).join("")
        + "<span><span class=\"kb\">right-click</span></span><span>every verb of any row, chip, cell, chart or file</span>"
        + "</div></div>"
        + '<div class="hint">The same text: <span class="mono">pmukit help ' + esc(h.screen || "") + "</span>. "
        + "Every error carries four parts: what happened, why, what to do, where to look.</div>"
        + "</div></div>";
  }
  if (S.note){
    /* an explanation in the page, not a browser dialog: nothing blocks, Esc or Close shuts it */
    out += '<div class="help" role="dialog" aria-label="' + esc(S.note.title) + '"><div class="ph"><span>'
        + esc(S.note.title) + '</span><button class="btn sm" data-close="note">Close &middot; Esc</button></div>'
        + '<div class="pb" style="display:flex;flex-direction:column;gap:6px">'
        + (S.note.lines || []).map(function(l){
            return '<div style="line-height:1.5">' + esc(l) + "</div>"; }).join("")
        + "</div></div>";
  }
  if (S.palette){
    var q = S.paletteQ || "";
    var cmds = paletteCommands().filter(function(c){
      return !q || (c.label + " " + (c.hint || "")).toLowerCase().indexOf(q.toLowerCase()) >= 0;
    });
    out += '<div class="veil" data-close="palette"></div><div class="pal">'
        + '<input id="palinp" placeholder="type an action, a screen or a run id" value="' + esc(q) + '">'
        + '<div class="list">'
        + (cmds.length ? cmds.map(function(c, i){
            var id = regAction(function(){ S.palette = false; S.paletteQ = ""; c.run(); });
            return '<button class="it' + (i === 0 ? " on" : "") + '" data-act="' + id + '"><span>'
                 + esc(c.label) + '</span><span class="hint">' + esc(c.hint || "") + "</span></button>";
          }).join("")
          : '<div class="empty"><div class="t">nothing matches</div><div>Try a screen name, an action or a run id.</div></div>')
        + "</div></div>";
  }
  el("overlays").innerHTML = out;
  if (S.palette){
    var inp = el("palinp");
    if (inp){
      inp.focus();
      inp.oninput = function(){ S.paletteQ = inp.value; render(); };
      inp.onkeydown = function(e){
        if (e.key === "Enter"){
          var first = paletteCommands().filter(function(c){
            var qq = S.paletteQ || "";
            return !qq || (c.label + " " + (c.hint||"")).toLowerCase().indexOf(qq.toLowerCase()) >= 0; })[0];
          if (first){ S.palette = false; S.paletteQ = ""; first.run(); }
        }
      };
    }
  }
}
function wire(){
  document.querySelectorAll("[data-act]").forEach(function(n){
    n.onclick = function(e){ e.stopPropagation(); var f = ACTS[n.getAttribute("data-act")]; if (f) f(); };
  });
  document.querySelectorAll("[data-change]").forEach(function(n){
    n.onchange = function(){ var f = ACTS[n.getAttribute("data-change")]; if (f) f(n.value); };
  });
  /* Enter in a text box runs its action (data-enter="<action>"); data-keep / data-input
     ="<S.sel key>" keep what was typed across a re-render (two spellings, one behaviour). */
  document.querySelectorAll("[data-enter]").forEach(function(n){
    n.onkeydown = function(e){
      if (e.key !== "Enter") return;
      e.preventDefault(); var f = ACTS[n.getAttribute("data-enter")]; if (f) f(n.value);
    };
  });
  document.querySelectorAll("[data-keep],[data-input]").forEach(function(n){
    var key = n.getAttribute("data-keep") || n.getAttribute("data-input");
    n.oninput = function(){ S.sel[key] = n.value; };
  });
  document.querySelectorAll("[data-go]").forEach(function(n){
    n.onclick = function(){ go(n.getAttribute("data-go")); };
  });
  document.querySelectorAll("[data-close]").forEach(function(n){
    n.onclick = function(){
      var w = n.getAttribute("data-close");
      if (w === "menu") S.menu = null;
      if (w === "help") S.help = null;
      if (w === "note") S.note = null;
      if (w === "palette"){ S.palette = false; S.paletteQ = ""; }
      render();
    };
  });
  document.querySelectorAll("[data-menu]").forEach(function(n){
    n.oncontextmenu = function(e){
      openMenu(e, n.getAttribute("data-menu"), n.getAttribute("data-menutitle"),
               CTXS[n.getAttribute("data-menuctx")] || {});
    };
  });
  var cc = document.querySelector("[data-copycli]");
  if (cc) cc.onclick = function(){ copy(S.cli); };
  var hb = document.querySelector("[data-help]");
  if (hb) hb.onclick = function(){ openHelp(); };
  document.querySelectorAll("[data-chart]").forEach(hoverChart);
}
function openHelp(){
  api("/api/help/" + encodeURIComponent(S.screen)).then(function(h){ S.help = h; render(); },
      function(e){ showErr(e); });
}

/* --------------------------------------------------------- shared blocks - */
function panel(title, sub, body, opts){
  opts = opts || {};
  return '<div class="panel" style="' + (opts.style || "flex:1") + '"><div class="ph"><span>'
       + title + "</span>" + (sub ? '<span class="sub">' + sub + "</span>" : (opts.right || ""))
       + '</div><div class="pb' + (opts.flush ? " flush" : "") + '" style="' + (opts.bodyStyle || "") + '">'
       + body + "</div></div>";
}
function skeleton(rows, what){
  var lines = "";
  for (var i = 0; i < (rows || 5); i++){
    lines += '<div class="skel" style="width:' + (55 + ((i * 37) % 40)) + '%;margin-bottom:9px"></div>';
  }
  return '<div style="padding:4px 0">' + lines
       + (what ? '<div class="hint" style="margin-top:8px">' + esc(what) + "</div>" : "") + "</div>";
}
function loadingBlock(key, what){
  return skeleton(6, S.slow[key] ? what : "");
}
function emptyBlock(title, text, btnLabel, btnGo){
  return '<div class="empty"><span style="color:var(--ink3)">' + ICON.file + "</span>"
       + '<div class="t">' + esc(title) + "</div><div>" + esc(text) + "</div>"
       + (btnLabel ? '<button class="btn" style="margin-top:6px" data-go="' + btnGo + '">'
                     + esc(btnLabel) + "</button>" : "") + "</div>";
}
/* The four-part error, with the Do actions as real buttons. The table that produced it is
   rendered underneath, never replaced. `pick` is an optional row of controls a screen offers
   to fix the error in place (the New screen's PMU instance picker). */
function errBlock(screen, pick){
  var e = S.errs[screen];
  if (!e) return "";
  var er = e.error || {};
  var dos = (er.do || []).map(function(d){
    var id = regAction(function(){ doAction(d, e); });
    return '<button class="btn sm" data-act="' + id + '">' + esc(d) + "</button>";
  }).join(" ");
  if (er.empty){
    /* "nothing here yet" (no netlist loaded, say) is the first step, not a failure: no red, no
       status code, just what is missing and the button that fills it */
    return '<div class="callout" style="margin-bottom:12px"><div class="rowflex"><b>'
         + esc(er.what || "") + '</b><span class="rowflex">' + dos + "</span></div>"
         + (pick ? '<div class="rowflex" style="margin-top:6px">' + pick + "</div>" : "") + "</div>";
  }
  var rid = regAction(function(){ if (e.retry) e.retry(); });
  return '<div class="err"><div class="t">' + ICON.x + " " + esc(er.what || "something failed")
       + (e.status ? ' <span class="badge b-bad">' + e.status + "</span>" : "") + "</div>"
       + '<div class="row"><span class="k">What</span><span>' + esc(er.what || "") + "</span></div>"
       + '<div class="row"><span class="k">Why</span><span>' + esc(er.why || "") + "</span></div>"
       + '<div class="row"><span class="k">Do</span><span class="rowflex">' + dos
       + '<button class="btn sm" data-act="' + rid + '">' + ICON.retry + " Try again</button></span></div>"
       + (pick ? '<div class="row"><span class="k">Pick</span><span class="rowflex">' + pick + "</span></div>" : "")
       + '<div class="row"><span class="k">Where</span><span class="mono">' + esc(er.where || "-") + "</span></div>"
       + "</div>";
}
function doAction(text, e){
  var t = String(text || "");
  if (/pmu instance/i.test(t) && el("instpick")) return el("instpick").focus();
  if (/path on this machine/i.test(t) && el("nlpath")) return el("nlpath").focus();
  if (/new screen/i.test(t)) return go("new");
  if (/plan screen/i.test(t)) return go("plan");
  if (/run screen/i.test(t)) return go("run");
  if (/model screen/i.test(t)) return go("model");
  if (/\bhome\b/i.test(t)) return go("home");
  if (/\bsettings\b/i.test(t)) return go("settings");
  if (/reload/i.test(t)) return window.location.reload();
  if (/try again|retry/i.test(t)){ if (e && e.retry) return e.retry(); }
  copy(t);
}
function jobBlock(){
  if (!S.job) return "";
  var j = S.job, pct = Math.round((j.progress || 0) * 100);
  var working = j.status === "running" || j.status === "queued";
  if (!working && j.screen && j.screen !== S.screen) return "";
  var cls = j.status === "failed" ? "bad" : j.status === "partial" ? "warn" : "";
  var id = regAction(function(){ S.job = null; render(); });
  /* a failure's what/why/do/where is the banner above; the strip does not say it a second time:
     a refusal says only "refused" */
  var msg = j.status !== "failed" ? (j.message || j.status)
          : j.error_kind === "refused" ? "refused"
          : S.errs[S.screen] ? "failed — see the error above" : "failed";
  return '<div class="prog" style="' + (cls === "bad" ? "border-color:var(--bad-line);background:var(--bad-bg)"
        : cls === "warn" ? "border-color:var(--warn-line);background:var(--warn-bg)" : "") + '">'
       + "<b>" + esc(j.title || j.job) + "</b>"
       + '<div class="bar"><div class="seg" style="background:var(--acc);width:' + pct + '%"></div></div>'
       + '<span class="hint">' + esc(msg) + "</span>"
       + (working ? "" : '<button class="btn sm" data-act="' + id + '">Dismiss</button>')
       + "</div>";
}
/* "Why this run exists", "What is this block": a small panel on the page, never a browser
   dialog (it blocks the page and every automation driving it). */
function explain(title, lines){
  S.note = { title: title, lines: (lines || []).filter(function(l){ return l; }).map(String) };
  if (!S.note.lines.length) S.note.lines = ["pmukit has no explanation recorded for this."];
  render();
}

/* Where the netlist came from, and the one-click way back to it: the bench fixed in Virtuoso
   and exported to the same path is "Re-read", not a second trip through the file picker. */
function netlistSourceKv(info){
  var s = (info && info.source) || null, cp = (info && info.copy) || null;
  if (!s && !cp && info && info.attempt) return attemptKv(info);     /* nothing good loaded yet */
  var other = regAction(function(){ S.sel.loadAnother = !S.sel.loadAnother; render(); });
  var where, btns = "";
  if (s && s.path){
    var again = regAction(function(){ loadNetlist({ reread: true, which: "source" }); });
    where = '<span class="mono">' + esc(s.path) + "</span>"
      + (s.typed && s.typed !== s.path ? ' <span class="hint">typed as <span class="mono">' + esc(s.typed) + "</span></span>" : "")
      + (s.on_disk === "changed" ? ' <span class="badge b-warn">changed on disk since the last read</span>'
         : s.on_disk === "missing" ? ' <span class="badge b-bad">no longer there</span>' : "");
    btns = '<button class="btn sm" data-act="' + again + '"' + (s.on_disk === "missing" ? " disabled" : "")
      + ">" + ICON.retry + " Re-read " + esc(s.name || "the netlist") + "</button>";
  } else if (s){
    where = '<span class="mono">' + esc(s.name || "input.scs") + '</span> <span class="hint">dropped into the '
      + "browser, which never tells pmukit where a file lives: load it by path once to make re-reading one click</span>";
  } else {
    where = '<span class="hint">not recorded (loaded before pmukit kept the path)</span>';
  }
  btns += '<button class="btn sm" data-act="' + other + '">' + (S.sel.loadAnother ? "Cancel" : "Load another&hellip;") + "</button>";
  var ch = s && s.changes && s.changes.text;
  return '<span class="k">Netlist</span><span style="display:flex;flex-direction:column;gap:5px">'
    + "<span>" + where + "</span>"
    + '<span class="rowflex">' + btns + "</span>"
    + (ch ? '<span class="hint">' + (s.changes.unchanged ? "unchanged" : "last read") + ": " + esc(ch)
        + (s.loaded_at ? " &middot; " + esc(ago(s.loaded_at)) : "") + "</span>" : "")
    + "</span>"
    + (cp ? '<span class="k">Working copy</span><span class="mono">' + esc(cp.path) + " &middot; "
        + Math.round((cp.bytes || 0) / 1024) + " KB &middot; sha " + esc((cp.sha || "").slice(0, 8)) + "</span>" : "")
    + attemptKv(info);
}
/* The last load the scan refused: staged, never the working copy. Shown until a load succeeds,
   with the one click that reads the (fixed) file again. The row is a ONE-LINE summary: the
   full What / Why / Do / Where is the banner above it (put up by the load, or brought back
   from the staged attempt after a reload), never printed twice. */
function attemptKv(info){
  var a = info && info.attempt;
  if (!a) return "";
  var again = a.path ? regAction(function(){ loadNetlist({ reread: true, which: "attempt" }); }) : "";
  return '<span class="k">Refused</span><span style="display:flex;flex-direction:column;gap:5px">'
    + '<span><span class="mono" title="' + esc(a.path || "") + '">' + esc(a.name || a.path || "input.scs")
    + '</span> <span class="badge b-bad">not loaded</span>'
    + ' <span class="hint">' + esc(refusedSummary(a.error)) + "</span>"
    + (a.loaded_at ? ' <span class="hint">&middot; ' + esc(ago(a.loaded_at)) + "</span>" : "") + "</span>"
    + '<span class="rowflex">' + (again ? '<button class="btn sm" data-act="' + again + '">' + ICON.retry
        + " Re-read " + esc(a.name || "it") + "</button>" : "")
    + '<span class="hint">' + (info.copy ? "the working copy and every answer are the last good ones"
        : "nothing was loaded") + "</span></span></span>";
}
/* "decap on a rail: Cdecap (capacitor) on rail ... line 41." -> "decap on a rail". The head of
   the error's What, before its detail; a What with no head is cut at a word. */
function refusedSummary(er){
  var w = String((er && er.what) || "the scan refused it");
  var head = w.split(": ")[0].replace(/[.\s]+$/, "");
  if (head.length > 60) head = head.slice(0, 60).replace(/\s+\S*$/, "") + "…";
  return head;
}
/* The staged attempt as the four-part banner: after a reload the banner is gone with the page,
   the refusal is not -- it is still on disk (netlists/attempt.json). Put up ONCE per attempt
   and page: dismissing it, or any later success on New, is final until a new refusal. */
function attemptBanner(src){
  var a = src && src.attempt;
  if (!a || !a.error) return;
  var k = String(a.sha || "") + "@" + String(a.loaded_at || "");
  if (S.attemptSeen === k) return;
  S.attemptSeen = k;
  if (S.errs.new) return;            /* the load that was just refused put its own up */
  S.errs.new = { status: 0, kind: "refused", error: a.error, attempt: true,
                 retry: a.path ? function(){ loadNetlist({ reread: true, which: "attempt" }); }
                               : function(){ delete S.errs.new; render(); } };
}

/* One entry per included file: the ONE section= line a corner rewrites (the process corner) and
   the fixed model-library lines of the same file (Noise_Worst, pre_Sim...), kept as exported.
   When the section names do not say which line is the corner, the user picks it here. */
function pdkIncludes(pins){
  var inc = (pins && pins.includes) || null;
  if (!inc) return esc(Object.keys(pins.sections || {}).map(function(k){ return k + " section=" + pins.sections[k]; }).join(" · ") || "-");
  var order = [], by = {};
  inc.forEach(function(i){
    if (!i.section) return;
    if (!by[i.file]){ by[i.file] = { corner: null, fixed: [], lines: [], how: i.how, sure: i.sure !== false }; order.push(i.file); }
    by[i.file].lines.push(i);
    if (i.corner) by[i.file].corner = i; else by[i.file].fixed.push(i.section);
  });
  return order.map(function(f){
    var e = by[f], out = esc(f);
    out += e.corner ? " section=" + esc(e.corner.section) + " &mdash; process corner (varied)" : "";
    if (e.fixed.length) out += (e.corner ? " &middot; " : " ") + "section=" + esc(e.fixed.join(", "))
      + " &mdash; fixed, kept as exported";
    if (e.lines.length > 1 && (!e.sure || e.how === "chosen" || e.how === "none")){
      var act = regAction(function(v){ pickCornerLine(f, e, parseInt(v, 10)); });
      out += ' <span class="hint">' + (e.sure ? "corner line:" : "which line is the process corner?")
        + '</span> <select class="inp mono" data-change="' + act + '">'
        + e.lines.map(function(l){
            return '<option value="' + l.index + '"' + (l.corner ? " selected" : "") + ">section="
              + esc(l.section) + "</option>"; }).join("") + "</select>";
    }
    return out;
  }).join("<br>") || "-";
}
/* The corner line of a file is the user's answer (config.corner_include); a corner list that
   was just the old line's section follows the new line. */
function pickCornerLine(file, e, idx){
  var cur = (S.data["config"] || {}).config;
  if (!cur || isNaN(idx)) return;
  var next = JSON.parse(JSON.stringify(cur));
  next.corner_include = next.corner_include || {};
  next.corner_include[file] = idx;
  var line = e.lines.filter(function(l){ return l.index === idx; })[0];
  var was = e.corner ? e.corner.section : null;
  if (line && next.corners instanceof Array && next.corners.length === 1 && next.corners[0] === was)
    next.corners = [line.section];
  putConfig(next, "process-corner include line of " + file + " chosen", null,
            function(){ forget("pins"); });
}
function vsetParamPicker(cfg, pins){
  // The name is the designer's, not pmukit's: offer what the netlist declares, keep a name the
  // netlist does not declare visible (plan refuses it when more than one code is asked for).
  // The default VSET, when the netlist has none, is not an answer: the picker asks "(choose)".
  var cur = cfg.vset_param || "VSET";
  var names = Object.keys((pins && pins.params) || {});
  var choose = cur === "VSET" && names.length && names.indexOf(cur) < 0;
  var act = regAction(function(v){
    var name = String(typeof v === "string" ? v : el("vsetparam").value).trim();
    var bad = !name ? "type the name of the design variable, e.g. VSET"
            : /^[A-Za-z_][A-Za-z0-9_]*$/.test(name) ? ""
            : '"' + name + '" is not a netlist parameter name (letters, digits and _, not starting with a digit)';
    setBad("in:vsetparam", bad);
    if (bad){ S.sel["in:vsetparam"] = name; render(); return; }
    patchConfig("vset_param", name, "in:vsetparam"); });

/* A code variable read from the parameters (not VSET) is a suggestion until confirmed; the
   parameters that are expressions of the chosen one are named, so the sweep's reach is seen. */
function vsetSuggestion(cfgd, pins){
  var cfg = cfgd.config, cv = (pins && pins.code_var) || {};
  var cur = cfg.vset_param || "VSET";
  var fol = ((pins && pins.param_followers) || {})[cur] || [];
  var out = "";
  if (cv.suggested && cv.param === cur && ((cfgd.answers || {}).vset_confirmed !== cur)){
    var ok = regAction(function(){
      api("/api/p/" + P() + "/config", { method:"PUT",
          body:{ config: cfg, note: "code variable confirmed", confirm: "vset_param" } })
        .then(function(d){

                               undoable:d.undoable, history:[] };

      + '<button class="btn sm" data-act="' + ok + '">Confirm</button>';

  if (fol.length) out += '<span class="hint">follows ' + esc(cur) + ": " + esc(fol.join(", ")) + "</span>";
  return out;
}

function derivedBlock(){

function pickFile(){

function loadNetlist(body){

  startJob(api("/api/p/" + P() + "/netlist", { method:"POST", body: body }),
           body.reread ? "re-reading the netlist" : "parsing the netlist",
           function(j){
             if (j && j.status === "done"){ S.sel.loadAnother = false; settled("new"); }
             /* Try again = read it again: the bench was fixed and exported to the same place */
             if (j && j.status === "failed" && S.errs.new) S.errs.new.retry = function(){ loadNetlist(body); };
             forget("pins"); forget("config"); forget("derived"); forget("plan"); forget("consequences");

/* `typedKey`: the box the value came from -- its unsaved typing is dropped once it is saved. */
function patchConfig(key, value, typedKey){
  var cur = (S.data["config"] || {}).config;
  if (!cur) return;
  var next = JSON.parse(JSON.stringify(cur));
  if (key === "temps_c") value = value.map(Number).sort(function(a, b){ return a - b; });
  next[key] = value;
  putConfig(next, key + " changed", typedKey);
}
function toggleSwitch(rail){
  var cur = (S.data["config"] || {}).config;
  if (!cur || !cur.my_load[rail]) return;
  var next = JSON.parse(JSON.stringify(cur));
  next.my_load[rail].switches = !next.my_load[rail].switches;
  putConfig(next, rail + " load-EN toggled");

/* Only the boxes that were typed into are read (a shown value is rounded for display and must
   not overwrite the saved one). Every bad box is marked; nothing is sent until all read. */
function saveLoadsFromInputs(after){
  var cur = (S.data["config"] || {}).config;
  if (!cur) return;
  var next = JSON.parse(JSON.stringify(cur));
  var bad = 0, changed = 0;
  Object.keys(next.my_load || {}).forEach(function(rail){
    ["on_a", "off_a"].forEach(function(k){
      var key = "in:load:" + rail + ":" + k;
      if (S.sel[key] === undefined) return;
      var r = readEng(S.sel[key], "A", k === "on_a" ? "an on current" : "an off current");
      if (!r.bad && r.v < 0) r.bad = "a load current is a magnitude: write it without the sign";
      setBad(key, r.bad);
      if (r.bad){ bad++; return; }
      next.my_load[rail][k] = r.v; changed++;
    });
  });
  if (bad){ render(); return; }
  if (!changed){
    if (after){ dropTyped("in:load:"); after(); return; }
    S.toast = "no load number was changed"; render();
    setTimeout(function(){ S.toast = ""; render(); }, 1400); return;
  }
  putConfig(next, "load numbers edited", "in:load:", after);
}
/* "Build plan": typing that was never saved must not be dropped on the way out. Load numbers
   are saved first (the one box set a user edits and then walks away from); any other unsaved
   box is named and the move refused -- guessing whether "5G" was meant is not ours to do. */
function buildPlan(){
  var typed = Object.keys(S.sel).filter(function(k){
    return k.indexOf("in:") === 0 && S.sel[k] !== undefined && S.sel[k] !== null;
  });
  var other = typed.filter(function(k){ return k.indexOf("in:load:") !== 0; });
  if (other.length){
    var names = { "in:fmax": "highest frequency", "in:vset": "codes",
                  "in:vsetparam": "code var", "in:roledc": "role DC value" };
    S.toast = "not saved yet: " + other.map(function(k){ return names[k] || k.slice(3); })
      .join(", ") + " -- press Set (or Enter) first";
    render(); setTimeout(function(){ S.toast = ""; render(); }, 4000);
    return;
  }
  if (typed.length){
    // a bad number stays on New with its own message; only a landed save moves on
    saveLoadsFromInputs(function(){ go("plan"); });
    return;
  }
  go("plan");
}
function putConfig(cfg, note, typedKey, after){
  api("/api/p/" + P() + "/config", { method:"PUT", body:{ config: cfg, note: note } })
    .then(function(d){
      S.data["config"] = { exists:true, config:d.config, sha:d.sha, answers:d.answers || {}, undoable:d.undoable, history:[] };
      S.undoable = d.undoable;
      if (typedKey) dropTyped(typedKey);
      settled(S.screen);
      if (after) after(d);
      forget("derived"); forget("plan"); forget("consequences");
      render(); refreshCli();
    }, showErr);
}
function doUndo(){
  api("/api/p/" + P() + "/config/undo", { method:"POST", body:{} }).then(function(d){
    settled(S.screen);
    forget("config"); forget("derived"); forget("plan"); forget("consequences"); forget("pins");
    dropTyped("in:"); S.sel.measured = null;       /* the boxes show what was restored */
    S.undoable = d.undoable || "";
    S.toast = "undone: " + d.kind;
    render(); setTimeout(function(){ S.toast = ""; render(); }, 1400);
  }, showErr);
}
/* One rail, the row's own: the other rails' numbers (saved or being typed) are not touched.
   The ON current is the dc of its IL_ source; the OFF current is not in the netlist, so it is
   only filled in when the saved one cannot stand next to the new ON (off must stay below on). */
function measureLoad(rail){
  api("/api/p/" + P() + "/measure-load", { method:"POST", body:{ rail: rail } }).then(function(d){
    var cur = (S.data["config"] || {}).config;
    var m = (d.rails || {})[rail];
    if (!cur || !m) return;
    var next = JSON.parse(JSON.stringify(cur));
    if (!next.my_load[rail]) next.my_load[rail] = { on_a: 0, off_a: 0, switches: true };
    var ld = next.my_load[rail], was = ld.on_a, keys = "in:load:" + rail + ":on_a";
    ld.on_a = m.on_a;
    var text = rail + " on " + eng(was, "A") + " → measured " + eng(m.on_a, "A")
             + (m.on_from ? " (" + m.on_from + ")" : "");
    if (!(Number(ld.off_a) >= 0) || Number(ld.off_a) >= m.on_a){
      text += "; off " + eng(ld.off_a, "A") + " → " + eng(m.off_a_suggested, "A")
            + " suggested (" + (m.off_note || "not in the netlist") + ")";
      ld.off_a = m.off_a_suggested;
      keys = "in:load:" + rail + ":";
    }
    putConfig(next, rail + " load measured from the netlist", keys,
              function(){ S.sel.measured = { rail: rail, text: text }; });
  }, showErr);
}

      why: "dsub -A names the account a job is charged to; Donau rejects a submit without one.",
      do: ["Pick one in the Account list next to Submit",
           "Or add one in Settings"],
      where: "Plan > Account" } });

  startJob(api("/api/p/" + P() + "/submit", { method:"POST",
      body:{ commit_only: !!commitOnly, account: s.account || "" } }),
    commitOnly ? "writing the ledger (nothing submitted)" : "submitting the plan",
    function(){ if (S.screen === "run") refreshRun(); },
    function(){ forget("ledger"); forget("run:"); go("run"); });

/* The unrun HB check's note, ending in the consequence: every large-signal term stays off. A
   note that already says so is not told twice, and the sentences join on ONE period (a note
   ending "... and re-run." plus ". Every ..." read "re-run.. Every"). */
function hbOffNote(note){
  var t = String(note || "").replace(/\s+$/, "");
  if (/stays off/i.test(t)) return t;
  var tail = "Every large-signal term stays off.";
  if (!t) return tail;
  return t.replace(/[.\s]+$/, "") + ". " + tail;
}
function gradesGrid(gr){
  if (gr === undefined) return panel("Grade per port and cell", "",
    loadingBlock("model:grades", "grading every block against its limit"));
  if (!gr.rows || !gr.rows.length) return panel("Grade per port and cell", "",

      "", ""));

    return '<div class="cell c-head">' + esc(c.label) + "</div>"; }).join("");

    return '<div class="cell c-head" style="justify-content:flex-start;font-family:var(--mono);font-size:11.5px;color:var(--ink)">'

               + '" data-act="' + id + '"' + rc("cell", r.port + " " + c.corner + " " + c.temp_c, ctx)
               + ' title="' + esc(gridCellTitle(c)) + '"'
                  + ">" + gradeLabel(c.grade) + gridMarks(c) + "</div>";
        }).join("");

    + ',minmax(0,1fr))">' + head + body + "</div>"
    + '<div class="legend" style="margin-top:12px">'
    + '<span><span class="badge b-ok">OK</span> every block within tolerance</span>'
    + '<span><span class="badge b-warn">MARG</span> one block near its limit</span>'
    + '<span><span class="badge b-bad">FAIL</span> block outside tolerance</span>'
    + '<span><span class="badge b-acc">FIT</span> fitted, not yet judged</span>'
    + '<span><span class="badge b-mute">N/R</span> the data behind it was never run</span>'
    + '<span><i class="gm" style="font-style:normal;font-size:9px;border:1px solid;padding:0 3px;border-radius:2px">h</i>'
    + " held at MARG: the fit is inside the limit but the data does not pin a parameter</span>"
    + '<span><i class="gm" style="font-style:normal;font-size:9px;border:1px solid;padding:0 3px;border-radius:2px;color:var(--ink3)">off</i>'
    + " a block that ships switched off grades worse; it is shown, not counted</span></div>"
    + (gr.why ? '<div class="callout warn" style="margin-top:10px">' + ICON.warn + " "
        + esc(gr.why) + (gr.graded_by !== "verify"
          ? ' <button class="btn sm" style="margin-left:8px" data-act="'
            + regAction(function(){ doVerify(); }) + '">Run verify</button>' : "") + "</div>" : ""));
}
/* The grade in a grid cell is what the model does AS DELIVERED. Two small marks say what the
   colour alone cannot: "h" -- the headline grade is held at MARG for a reason (the data does
   not pin a parameter), and "off" -- a block that ships switched off (a large-signal term)
   grades worse than the cell; it is graded and shown, never averaged into the colour. */
function offWorse(c){
  var rank = { green:0, fitted:1, yellow:2, not_run:3, red:4 };
  return (c.off || []).filter(function(o){
    return (rank[o.grade] || 0) > (rank[c.grade] || 0) && o.grade !== "fitted"; });

function gridMarks(c){

function gridCellTitle(c){

function pickCell(port, corner, temp){

}
function cellDetail(){

        + esc((d.held_by || []).join(", ")) + '">held</span>' : "")
    + (offs.length ? '<span class="badge b-mute" title="graded, shown below, not part of this grade">'
        + offs.length + " off by default</span>" : "") + "</span>";
  return panel('<span class="mono">' + esc(S.sel.port) + "</span> &middot; " + esc(S.sel.corner)
    + " / " + esc(S.sel.temp) + " C",

/* the server's note starts "off by default: ..."; beside the badge that says so, drop it */
function offText(note){ return String(note || "").replace(/^off by default: /, ""); }
/* The row's WHY, on the row: a held grade, a yellow / red / not-run reason, a block that ships

function whyRow(b){

function hoverChart(node){

    var frac = (e.clientX - r.left) / r.width;
    var W = 520, X0 = 52, X1 = W - 8;
    var px = frac * W;
    var t = (px - X0) / (X1 - X0);
    if (t < 0 || t > 1){ box.style.display = "none"; svg.querySelector(".hov").innerHTML = ""; return; }
    var lg = c.x_log !== false;
    var f0 = lg ? Math.log10(c.x[0]) : c.x[0];
    var f1 = lg ? Math.log10(c.x[c.x.length - 1]) : c.x[c.x.length - 1];
    var target = f0 + t * (f1 - f0);
    var i = 0, best = Infinity;
    for (var k = 0; k < c.x.length; k++){

      + "   GT " + (g === null ? "-" : g.toPrecision(4) + yu)
      + "   model " + (m === null ? "-" : m.toPrecision(4) + yu) + "   " + db;
    var xv = X0 + (X1 - X0) * ((lg ? Math.log10(c.x[i]) : c.x[i]) - f0) / (f1 - f0);
    svg.querySelector(".hov").innerHTML = '<line x1="' + xv.toFixed(1) + '" x2="' + xv.toFixed(1)
      + '" y1="12" y2="184" stroke="var(--ink3)" stroke-dasharray="3 3"/>';

      flush();
