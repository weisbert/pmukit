/* The grades a deliverable carries are verify's only when verify is newer than the fit. When
   the shown deliverable's grades are the fit's own -- or the NEXT one's would be -- say so and
   offer to verify first. Delivering is never blocked. */
function verifyWarn(d, dv){
  var now = (d && d.verify) || {};
  var shown = dv && dv.provisional ? dv.provisional : "";
  var next = (now.state === "stale" || now.state === "missing") ? now.why : "";
  if (!shown && !next) return "";
  var lines = [];
  if (shown) lines.push("<b>This deliverable's grades are provisional:</b> " + esc(shown) + ".");
  if (next && (!shown || now.state === "stale" || !dv)) lines.push((shown ? "And now: " : "<b>Before you deliver:</b> ") + esc(next) + ".");
  var vid = regAction(function(){
    if (jobBusy()) return;
    startJob(api("/api/p/" + P() + "/verify", { method:"POST", body:{} }), "HB health check",
      function(){ forget("deliverables"); forget("model"); forget("cell:"); render(); });
  });
  return '<div class="callout warn" style="flex:none">' + lines.join("<br>")
       + '<div class="rowflex" style="margin-top:8px"><button class="btn sm" data-act="' + vid + '"' + busyAttr()
       + ">Verify first</button>"
       + '<span class="hint">then Deliver again for grades from the HB health check</span></div></div>';
}
/* "Diff against the previous deliverable": files, valid range, grades per port / block, the pin
   list, provenance, and the .scs / .va text (the server trims it to a readable size). */
function diffGradeCls(g){ return { green:"b-ok", yellow:"b-warn", red:"b-bad" }[g] || "b-mute"; }
function deliverDiff(dv){
  var key = "ddiff:" + dv.stamp;
  var r = need(key, "/api/p/" + P() + "/deliverables/" + encodeURIComponent(dv.stamp) + "/diff", "deliver");
  if (r === undefined) return loadingBlock(key, "comparing with the previous deliverable");
  var x = r.diff || {}, out = [];
  var f = x.files || {};
  var sec = function(t){ return '<div class="lbl" style="margin:12px 0 6px">' + esc(t) + "</div>"; };
  var list = function(a){ return (a || []).length ? '<span class="mono">' + esc(a.join(", ")) + "</span>" : '<span class="hint">none</span>'; };
  out.push(sec("Files") + '<div class="kv"><span class="k">added</span><span>' + list(f.added)
    + '</span><span class="k">removed</span><span>' + list(f.removed)
    + '</span><span class="k">changed</span><span>' + list(f.changed) + "</span></div>");
  var valid = x.valid || [];
  out.push(sec("Valid range") + (valid.length
    ? '<table class="t"><thead><tr><th>what</th><th>before</th><th>now</th></tr></thead><tbody>'
      + valid.map(function(v){ return "<tr><td>" + esc(v.what) + '</td><td class="mono">' + esc(v.a || "-")
        + '</td><td class="mono">' + esc(v.b || "-") + "</td></tr>"; }).join("") + "</tbody></table>"
    : '<div class="hint">unchanged</div>'));
  var gr = x.grades || [];
  out.push(sec("Grades per port and block") + (gr.length
    ? '<table class="t"><thead><tr><th>port</th><th>corner</th><th>block</th><th>before</th><th>now</th></tr></thead><tbody>'
      + gr.map(function(g){ return '<tr><td class="mono">' + esc(g.port) + "</td><td>" + esc(g.corner) + "</td><td>"
        + esc(g.block) + '</td><td><span class="badge ' + diffGradeCls(g.a) + '">' + esc(g.a || "absent") + "</span></td>"
        + '<td><span class="badge ' + diffGradeCls(g.b) + '">' + esc(g.b || "absent") + "</span></td></tr>"; }).join("")
      + "</tbody></table>"
    : '<div class="hint">unchanged</div>'));
  var pn = x.pins || {};
  var pinTxt = pn.note ? '<div class="hint">' + esc(pn.note) + "</div>"
    : !pn.a ? '<div class="hint">same pins, same order</div>'
    : '<div class="kv"><span class="k">added</span><span>' + list(pn.added)
      + '</span><span class="k">removed</span><span>' + list(pn.removed)
      + '</span><span class="k">modeled</span><span>' + (Object.keys(pn.modeled || {}).length
        ? '<span class="mono">' + esc(Object.keys(pn.modeled).map(function(p){
            return p + ": " + (pn.modeled[p][0] ? "modeled" : "pass-through") + " -> " + (pn.modeled[p][1] ? "modeled" : "pass-through"); }).join("; ")) + "</span>"
        : '<span class="hint">unchanged</span>')
      + '</span><span class="k">order</span><span>' + (pn.order_changed ? "<b>changed</b> -- re-check the instance line" : "unchanged") + "</span></div>";
  out.push(sec("Pins") + pinTxt);
  var pv = x.provenance || {};
  out.push(sec("Provenance") + (Object.keys(pv).length
    ? '<div class="kv">' + Object.keys(pv).map(function(k){
        var v = pv[k] || [];
        var s = function(z){ return z !== null && typeof z === "object" ? JSON.stringify(z) : String(z === null || z === undefined ? "-" : z); };
        return '<span class="k">' + esc(k) + '</span><span class="mono">' + esc(s(v[0])) + " &rarr; " + esc(s(v[1])) + "</span>"; }).join("") + "</div>"
    : '<div class="hint">unchanged</div>'));
  var tx = x.text || [];
  out.push(sec("Model text (.scs / .va), provenance header left out") + (tx.length
    ? tx.map(function(t){
        var body = t.diff ? t.diff.split("\n").map(function(ln){
            var c = ln.indexOf("+++") === 0 || ln.indexOf("---") === 0 ? "c"
                  : ln.charAt(0) === "+" ? "a" : ln.charAt(0) === "-" ? "d" : ln.indexOf("@@") === 0 ? "c" : "";
            return c ? '<span class="' + c + '">' + esc(ln) + "</span>" : esc(ln); }).join("\n")
          : esc(t.note || "no text change");
        return '<div style="margin-bottom:10px"><div class="rowflex"><span class="mono">' + esc(t.file) + "</span>"
          + '<span class="hint">+' + (t.added || 0) + " / -" + (t.removed || 0) + (t.truncated ? ", trimmed" : "") + "</span></div>"
          + '<div class="code" style="max-height:30vh;margin-top:4px">' + body + "</div></div>"; }).join("")
    : '<div class="hint">no .scs or .va changed</div>'));
  return '<div style="max-height:62vh;overflow:auto">' + out.join("") + "</div>";
}

/* -------------------------------------------------------------- Digest -- */
SCREENS.digest = {
  cli: function(){
    return { budget: S.sel.budget || 64000,
             blocks: Object.keys(S.sel.dblocks || {}).filter(function(k){ return S.sel.dblocks[k]; }) };
  },
  main: function(){
    if (!S.project) return noProject();
    var d = need("digest", "/api/p/" + P() + "/digest/blocks", "digest");
    if (d === undefined && S.errs.digest) return '<div class="col grow">' + errBlock("digest") + "</div>";
    if (d === undefined) return '<div class="col grow">' + panel("What goes across", "",
      loadingBlock("digest", "rendering every block to measure it")) + "</div>";
    if (!d.blocks.length) return '<div class="col grow">' + panel("What goes across", "",
      emptyBlock("Nothing to send yet", "A digest carries the ledger, the parameters and the "
        + "curves. This project has none of them yet.", "Go to Run", "run")) + "</div>";
    if (!S.sel.dblocks){
      S.sel.dblocks = {};
      d.blocks.forEach(function(b){ S.sel.dblocks[b.id] = !!b.included_by_default; });
    }
    var budget = S.sel.budget || (d.budgets || [64000])[1] || 64000;
    var chosen = d.blocks.filter(function(b){ return S.sel.dblocks[b.id]; })
      .slice().sort(function(a, b){ return a.priority - b.priority; });
    var acc = 0, kept = {};
    chosen.forEach(function(b){ if (acc + b.bytes <= budget){ acc += b.bytes; kept[b.id] = true; } });
    var totalSel = chosen.reduce(function(a, b){ return a + b.bytes; }, 0);
    var dropped = chosen.filter(function(b){ return !kept[b.id]; });
    var rows = d.blocks.map(function(b){
      var on = !!S.sel.dblocks[b.id];
      var fate = !on ? "off" : kept[b.id] ? "kept" : "dropped";
      var ctx = regCtx({ row: b,
        only: function(){ var o = {}; d.blocks.forEach(function(x){ o[x.id] = x.priority <= 1 || x.id === b.id; });
                          S.sel.dblocks = o; forget("digesttext"); render(); },
        all: function(){ var o = {}; d.blocks.forEach(function(x){ o[x.id] = true; });
                         S.sel.dblocks = o; forget("digesttext"); render(); } });
      var id = regAction(function(){
        S.sel.dblocks[b.id] = !on; forget("digesttext"); render(); refreshCli(); });
      return '<tr class="rc"' + rc("digest", b.title, ctx) + ">"
        + '<td><input type="checkbox" data-act="' + id + '"' + (on ? " checked" : "") + "></td>"
        + '<td style="' + (on ? "" : "color:var(--ink3)") + '"><div class="mono">' + esc(b.id)
        + "</div><div>" + esc(b.title) + "</div></td>"
        + '<td class="num">' + (b.bytes / 1000).toFixed(1) + "</td>"
        + '<td><span class="badge b-' + (fate === "kept" ? "ok" : fate === "dropped" ? "warn" : "mute")
        + '">' + fate + "</span></td></tr>";
    }).join("");
    var budgets = (d.budgets || []).map(function(b){
      return '<button class="chip' + (budget === b ? " on" : "") + '" data-act="'
        + regAction(function(){ S.sel.budget = b; forget("digesttext"); render(); refreshCli(); })
        + '">' + Math.round(b / 1000) + " KB</button>";
    }).join(" ");
    var left = panel("What goes across", "",
      '<table class="t"><thead><tr><th style="width:26px"></th><th>Block</th>'
      + '<th class="num">KB</th><th>Fate</th></tr></thead><tbody>' + rows + "</tbody></table>"
      + '<div style="padding:10px 13px;border-top:1px solid var(--line2)">'
      + '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">'
      + '<span><b class="mono">' + (totalSel / 1000).toFixed(1) + ' KB</b> selected &middot; <b class="mono">'
      + (acc / 1000).toFixed(1) + " KB</b> fits in " + Math.round(budget / 1000) + " KB</span>"
      + '<span class="hint">' + (acc > 32000 ? "split into " + Math.ceil(acc / 32000) + " parts" : "one paste")
      + "</span></div>"
      + '<div class="bar"><div class="seg" style="background:var(--acc);width:'
      + (100 * acc / Math.max(totalSel, 1)).toFixed(1) + '%"></div>'
      + '<div class="seg" style="background:var(--warn);width:'
      + (100 * (totalSel - acc) / Math.max(totalSel, 1)).toFixed(1) + '%"></div></div>'
      + '<div class="hint" style="margin-top:6px">Over budget, the lowest-priority blocks drop first '
      + "and are <b>named in the trailer</b>. Never a silent cut.</div></div>",
      { flush: true, right: '<div class="rowflex"><span class="hint">budget</span>' + budgets + "</div>" });
    var txt = S.data["digesttext"];
    var gen = regAction(function(){
      api("/api/p/" + P() + "/digest", { method:"POST", body:{
        budget: budget, blocks: Object.keys(S.sel.dblocks).filter(function(k){ return S.sel.dblocks[k]; }) } })
        .then(function(r){ S.data["digesttext"] = r; render(); }, showErr);
    });
    var right = panel("Preview", "",
      txt ? '<div class="code" style="max-height:48vh">' + esc(txt.text) + "</div>"
          + '<div class="hint" style="margin-top:8px">' + txt.parts.length + " part(s), " + txt.bytes
          + " bytes" + (txt.dropped.length ? " &middot; dropped: " + esc(txt.dropped.join(", ")) : "")
          + "</div>"
        : '<div class="empty"><div class="t">Nothing rendered yet</div>'
          + "<div>Pick the blocks and a budget, then render the text you will paste.</div>"
          + '<button class="btn" style="margin-top:6px" data-act="' + gen + '">Render the digest</button></div>',
      { right: txt ? '<div class="rowflex"><button class="btn sm" data-act="'
          + regAction(function(){ copy(txt.text); }) + '">' + ICON.copy + " Copy</button>"
          + '<button class="btn sm" data-act="' + gen + '">Re-render</button></div>' : "" });
    var imp = panel("On the desk", "the other half of this feature",
      '<div class="code wrap">' + esc(
        "pmukit digest import digest_" + S.project + ".txt   # rebuilds a dataset subset + params\n"
        + "pmukit reproduce " + S.project + " --from-digest      # refits and diffs every number\n"
        + "pmukit report " + S.project + " --cell ss/25c         # the same report text as the box")
      + "</div>"
      + '<div class="rowflex" style="margin-top:8px"><textarea class="inp" id="impbox" '
      + 'style="height:64px;width:100%;font-family:var(--mono);padding:6px" '
      + 'placeholder="paste a digest here to import it"></textarea></div>'
      + '<button class="btn sm" style="margin-top:6px" data-act="' + regAction(function(){
          var t = el("impbox").value;
          api("/api/digest/import", { method:"POST", body:{ text: t } })
            .then(function(r){ S.sel.imported = r; render(); }, showErr);
        }) + '">Import this digest</button>'
      + (S.sel.imported ? '<div class="code wrap" style="margin-top:8px;max-height:150px">'
          + esc(JSON.stringify(S.sel.imported, null, 1)) + "</div>" : ""),
      { style: "flex:none" });
    return '<div class="col" style="flex:0 0 600px">' + errBlock("digest") + jobBlock()
         + panel("Copy for desk", "",
             '<div class="hint">The box has no agent and no network. This packs what a desk debugger '
             + "needs into <b>plain text you paste through the relay</b>. Numbers are lossless; "
             + "curves are resampled and say so. Nothing crosses git.</div>", { style: "flex:none" })
         + left + "</div>"
         + '<div class="col grow">' + right + imp + "</div>";
  },
  foot: function(){
    var txt = S.data["digesttext"];
    return '<span class="hint">Digests live under PMUKIT_DATA/&lt;project&gt;/digest on both '
         + "machines, never in git.</span>"
         + '<button class="btn pri"' + (txt ? ' data-act="' + regAction(function(){ copy(txt.text); }) + '"' : " disabled")
         + ">" + ICON.copy + " Copy the digest</button>";
  }
};

      + '" style="flex:1;min-width:140px" placeholder="note, e.g. sims up to 1TB" value="' + esc(S.sel.acctNote || "") + '">'
      + '<button class="btn" data-act="' + add + '">Add account</button></div>'
      + envNote("account", s.account),
      { style: "flex:none" });
    var envRows = (s.environment || []).map(function(f){
      return '<span class="k">' + esc(f.name) + '</span><span><span class="mono">'
           + (f.value ? esc(f.value) : '<span style="color:var(--ink3)">(not found)</span>') + "</span>"
           + (f.source ? ' <span class="hint">from ' + esc(f.source) + "</span>" : "") + "</span>";
    }).join("");
    var env = panel("Read from this machine", "read-only &middot; from the environment",
      '<div class="kv">' + envRows
      + '<span class="k">site.json</span><span class="mono">' + esc(s.path || "-") + "</span></div>"
      + (s.demo ? '<div class="hint" style="margin-top:8px">Demo mode: nothing is read or saved.</div>'
                : '<div class="hint" style="margin-top:8px">Set by the login scripts, not here: source the '
                  + "site setup before <span class=\"mono\">pmukit ui</span> to change them.</div>"),
      { style: "flex:none" });
    return '<div class="col grow">' + errBlock("settings") + where + "</div>"
         + '<div class="col" style="flex:0 0 480px">'
         + (fields.indexOf("accounts") >= 0 ? accounts : "") + env + "</div>";
  },
  foot: function(){
    var back = S.prev && S.prev !== "settings" && SCREENS[S.prev] ? S.prev : "home";
    var name = (STEPS.filter(function(x){ return x[2] === back; })[0] || [0, back])[1];
    return '<span class="hint">Settings of this machine, shared by every project; they live in '
         + '<span class="mono">site.json</span> under PMUKIT_DATA.</span>'
         + '<button class="btn pri" data-go="' + esc(back) + '">Back to ' + esc(name) + " " + ICON.arrow + "</button>";
  }
};
function saveSite(body, after){
  api("/api/site", { method:"PUT", body: body }).then(function(d){
    S.data["site"] = d; delete S.errs.settings;
    if (after) after(d);
    S.toast = d.demo ? "demo: not saved" : "saved";
    render(); refreshCli();
    setTimeout(function(){ S.toast = ""; render(); }, 1400);
  }, showErr);
}

/* -------------------------------------------------------------- States -- */
SCREENS.states = {
  cli: function(){ return {}; },
  main: function(){
    var demoErr = { what: "Netlist rejected: 2 pins have no role.",
      why: "pmukit tells rails from biases only by the source-name prefix; it never guesses.",
      do: ["Rename the sources (IL_VDD0P8_A, VB_IB_PTAT) and export again",
           "Or right-click the pin and set its role by hand"],
      where: "tb/input.scs lines 41, 57" };
    var eid = regAction(function(){});
    return '<div class="col grow" style="min-width:100%"><div style="display:grid;'
      + 'grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">'
      + panel("New &middot; error state", "", (function(){
          var saved = S.errs.states;
          S.errs.states = { status: 400, error: demoErr, retry: function(){} };
          var html = errBlock("states");
          S.errs.states = saved;
          return html + '<div class="hint">Four parts, always: what happened, why, what to do, '
               + "where to look. The pin table stays on screen so the fix is one right-click away.</div>";
        })())
      + panel("New &middot; loading state", '<span class="badge b-acc">parsing</span>',
          '<div class="hint">Parsing <span class="mono">tb/input.scs</span>, 41 KB, resolving 10 pins</div>'
          + skeleton(4, "") + '<div class="hint">Skeleton rows in the shape of the table that will '
          + "appear; no spinner-only screens. Anything longer than 2 s says what it is doing.</div>")
      + panel("Plan &middot; empty state", '<span class="badge b-mute">nothing to plan</span>',
          emptyBlock("No plan yet", "Finish the three questions on New. The plan is computed from "
            + "them and from the model spec; there is nothing to fill in here.", "Go to New", "new"))
      + panel("Run &middot; error state", '<span class="badge b-bad">queue unreachable</span>',
          '<div class="callout bad"><b>Cannot submit: dsub is not answering.</b> The planned runs '
          + "are written to disk but none was submitted. <span class=\"mono\">dsub --json</span> "
          + "timed out after 30 s. Retry when the scheduler is back; the ledger resumes exactly "
          + "where it stopped.</div>"
          + '<div class="hint" style="margin-top:8px">Sibling errors with the same shape: licence '
          + "not found, PDK directory missing, ahdl compile failed, disk full.</div>")
      + panel("Model &middot; empty state", '<span class="badge b-mute">not fitted</span>',
          '<div class="empty"><div class="t">Model not fitted yet</div><div>191 of 282 runs are '
          + "done. The fit needs every DC and AC group complete; noise and transients can arrive "
          + "later and refine it.</div></div>")
      + panel("Deliver &middot; partial state", '<span class="badge b-warn">with reservations</span>',
          '<div class="callout warn"><b>This deliverable carries 1 NOT RUN block and 1 MARG cell.</b> '
          + "Both are printed in report.md and in every .va header. Deliver anyway, or go back and "
          + "retry the missing run.</div>"
          + '<div class="hint" style="margin-top:8px">Nothing is blocked silently; nothing is '
          + "hidden. The user decides, the report remembers.</div>")
      + "</div></div>";
  },
  foot: function(){
    return '<span class="hint">State sheet: how each screen looks when empty, loading, failing or '
         + "partial. The message grammar is fixed: what, why, do, where.</span>"
         + '<span class="hint">not a step &middot; reference for the build</span>';
  }
};

/* ------------------------------------------------------ command palette -- */
function paletteCommands(){
  var cmds = STEPS.map(function(s){
    return { label: "Go to " + s[1], hint: "key " + s[0], run: function(){ go(s[2]); } };
  });
  cmds.push({ label: "Copy for desk (digest)", hint: "4b", run: function(){ go("digest"); } });
  cmds.push({ label: "Screen states reference", hint: "states", run: function(){ go("states"); } });
  cmds.push({ label: "Help for this screen", hint: "?", run: function(){ openHelp(); } });
  cmds.push({ label: "Undo the last configuration change", hint: "Ctrl Z", run: function(){ doUndo(); } });
  cmds.push({ label: "Copy the command echo", hint: "$", run: function(){ copy(S.cli); } });
  cmds.push({ label: "Reload everything from the server", hint: "cache", run: function(){
    S.data = {}; S.loading = {}; S.failed = {}; render(); } });
  if (S.project){
    cmds.push({ label: "Fit the model", hint: S.project, run: function(){ doFit(); } });
    cmds.push({ label: "Verify (HB health check)", hint: S.project, run: function(){ doVerify(); } });
    cmds.push({ label: "Write the deliverable", hint: S.project, run: function(){ doDeliver(); } });
    cmds.push({ label: "Submit the plan", hint: S.project, run: function(){ doSubmit(); } });
    if (S.data["plan"]) cmds.push({ label: "Copy the plan as CSV", hint: "clipboard",
                                    run: function(){ copy(planCsv()); } });
    cmds.push({ label: "Open report", hint: "report.md of the latest deliverable", run: function(){ openReport(); } });
  }
  cmds.push({ label: "Settings: engine, queue, Donau accounts", hint: "this machine", run: function(){ go("settings"); } });
  cmds.push({ label: "New project", hint: "Home", run: function(){ newProject(""); } });
  var q = (S.paletteQ || "").trim();
  if (/^[0-9a-f]{6,}$/i.test(q)){
    cmds.unshift({ label: "Open run " + q, hint: "run id", run: function(){
      S.sel.run = q; forget("run:"); go("run"); } });
  }
  return cmds;
}

/* --------------------------------------------------------------- keys --- */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "Escape"){
    if (S.palette){ S.palette = false; S.paletteQ = ""; render(); return; }
    if (S.menu){ S.menu = null; render(); return; }
    if (S.help){ S.help = null; render(); return; }
    if (S.note){ S.note = null; render(); return; }
    if (S.errs[S.screen]){ delete S.errs[S.screen]; render(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault(); S.palette = true; S.paletteQ = ""; render(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
    e.preventDefault(); primary(); return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")){
    if (typing) return;
    e.preventDefault();
    if (S.project) doUndo();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "?"){ e.preventDefault(); openHelp(); return; }
  if (e.key === "c" && S.screen === "run" && S.sel.run){
    var rd = (S.data["run:" + S.sel.run] || {}).run;
    if (rd && rd.status === "failed"){ e.preventDefault(); failureBundle(rd.run_id); }
    return;
  }
  if (e.key >= "0" && e.key <= "5"){
    var s = STEPS[Number(e.key)];
    if (s){ e.preventDefault(); go(s[2]); }
    return;
  }
});
function primary(){
  if (S.screen === "new") return go("plan");
  if (S.screen === "plan") return doSubmit();
  if (S.screen === "run") return doFit();
  if (S.screen === "model") return doDeliver();
  if (S.screen === "deliver") return doDeliver();
  if (S.screen === "digest"){
    var t = S.data["digesttext"];
    if (t) return copy(t.text);
  }
  if (S.screen === "home") return S.sel.newName ? createProject() : newProject("");
}
document.addEventListener("click", function(){ if (S.menu){ S.menu = null; render(); } });
document.addEventListener("contextmenu", function(e){
  /* Objects opt in through data-menu; anywhere else keeps the browser's own menu suppressed
     inside the app frame so a stray right-click does not look like a dead zone. */
  if (e.target && e.target.closest && e.target.closest("[data-menu]")) return;
  if (e.target && e.target.closest && e.target.closest(".app")) e.preventDefault();
});
/* drag and drop a netlist anywhere on the New screen */
document.addEventListener("dragover", function(e){
  if (S.screen !== "new") return;
  e.preventDefault();
  var d = el("drop"); if (d) d.classList.add("over");
});
document.addEventListener("dragleave", function(){ var d = el("drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", function(e){
  if (S.screen !== "new" || !S.project) return;
  e.preventDefault();
  var d = el("drop"); if (d) d.classList.remove("over");
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){ loadNetlist({ text: String(rd.result), name: f.name }); };
  rd.readAsText(f);
});
/* back from Virtuoso: ask again whether the exported netlist changed on disk since the read */
window.addEventListener("focus", function(){
  if (S.screen !== "new" || !S.project || S.demo || !S.data["netlistsrc"]) return;
  if (S.job && S.job.status === "running") return;
  forget("netlistsrc"); render();
});

/* ---------------------------------------------------------------- boot -- */
/* The project to open on: ?project= in the URL, else the one `pmukit open <project>` handed the
   server (so a bare URL still lands there). A named project opens at the screen it was left on,
   unless ?screen= says otherwise; with none named, Home selects the first row. */
function boot(){
  var q = new URLSearchParams(window.location.search);
  if (q.get("project")) S.project = q.get("project");
  if (q.get("screen")) S.screen = q.get("screen");
  if (q.get("cell")) restoreCell(q.get("cell"), q.get("block"));
  render();
  refreshCli();
  api("/api/projects").then(function(d){
    S.demo = !!d.demo;
    S.data["projects"] = d;
    var named = S.project || d.initial_project || "";
    if (named){
      S.project = named; S.sel.project = named;
      /* the project's state: the screen it was left on (unless the URL names one) and the
         steps already done, which fill the nav circles after a reload */
      loadProgress(function(st){
        if (!q.get("screen") && S.screen === "home" && st.screen && SCREENS[st.screen]) go(st.screen);
      });
    } else if (d.projects && d.projects.length){
      S.sel.project = d.projects[0].name;
      S.project = d.projects[0].name;
      loadProgress();
    }
    render();
    refreshCli();
  }, function(){ render(); });
  setInterval(function(){
    if (S.screen === "run" && runLive()) refreshRun();
  }, RUN_REFRESH_MS);
}
boot();
