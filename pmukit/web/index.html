<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmukit</title>
<style>
/* ---------------------------------------------------------------- tokens ---- */
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1c1b18; --ink2:#5d5a53; --ink3:#8a867d;
  --line:#dedbd3; --line2:#ebe8e1; --line3:#cfccc4; --soft:#f3f1ec; --softer:#faf9f6;
  --acc:#1f6f9f; --acc-d:#16506f; --acc-bg:#e8f1f7; --acc-line:#bcd7e8;
  --ok:#2f7d4f; --ok-bg:#eef8f1; --ok-line:#bfe0cb;
  --warn:#b7791f; --warn-bg:#fbf5e6; --warn-line:#ecd9a8;
  --bad:#b3362e; --bad-bg:#fdeeec; --bad-line:#efc2bd;
  --gt:#b45309; --code-bg:#1c1b18; --code-ink:#e9e6de;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --sans:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --panel:#1e1d1a; --ink:#ece9e1; --ink2:#a9a49a; --ink3:#817c73;
    --line:#33312c; --line2:#2a2825; --line3:#454239; --soft:#262420; --softer:#1a1916;
    --acc:#61a8d4; --acc-d:#8cc4e6; --acc-bg:#1b2b36; --acc-line:#2f4c5e;
    --ok:#6fbe8d; --ok-bg:#16291e; --ok-line:#2c4a37;
    --warn:#d8a648; --warn-bg:#2c2517; --warn-line:#4e4123;
    --bad:#e08278; --bad-bg:#2e1a18; --bad-line:#553029;
    --gt:#e3944a; --code-bg:#0f0e0d; --code-ink:#d7d3c9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --panel:#1e1d1a; --ink:#ece9e1; --ink2:#a9a49a; --ink3:#817c73;
  --line:#33312c; --line2:#2a2825; --line3:#454239; --soft:#262420; --softer:#1a1916;
  --acc:#61a8d4; --acc-d:#8cc4e6; --acc-bg:#1b2b36; --acc-line:#2f4c5e;
  --ok:#6fbe8d; --ok-bg:#16291e; --ok-line:#2c4a37;
  --warn:#d8a648; --warn-bg:#2c2517; --warn-line:#4e4123;
  --bad:#e08278; --bad-bg:#2e1a18; --bad-line:#553029;
  --gt:#e3944a; --code-bg:#0f0e0d; --code-ink:#d7d3c9;
  color-scheme:dark;
}
/* ---------------------------------------------------------------- frame ----- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45}
a{color:var(--acc);cursor:pointer}
.mono{font-family:var(--mono)}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.nav{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.proj{color:var(--ink2);font-size:12.5px;padding-left:12px;border-left:1px solid var(--line);margin-left:4px;font-family:var(--mono)}
.steps{display:flex;gap:2px;margin-left:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:4px;color:var(--ink3);font-size:12.5px;background:none;border:0;cursor:pointer;font-family:inherit}
.step:hover{background:var(--soft)}
.step.cur{background:var(--acc-bg);color:var(--acc);font-weight:600}
.step .n{width:18px;height:18px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono)}
.step.done{color:var(--ink)}.step.done .n{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.navr{margin-left:auto;display:flex;gap:12px;color:var(--ink3);font-size:12px;align-items:center}
.main{flex:1;display:flex;gap:14px;padding:14px 16px 14px;min-height:0;align-items:stretch;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px;min-width:340px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line2);font-weight:600;font-size:13px;flex:none;flex-wrap:wrap}
.ph .sub{font-weight:400;color:var(--ink3);font-size:12px}
.pb{padding:12px 13px;overflow:auto;flex:1;min-height:0}
.pb.flush{padding:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.sel>td{background:var(--acc-bg)}
.t tr.click{cursor:pointer}.t tr.click:hover>td{background:var(--soft)}
.t tr.sel.click:hover>td{background:var(--acc-bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.id{font-family:var(--mono);font-size:12px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;line-height:16px}
.b-ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.b-warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.b-bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.b-mute{color:var(--ink3);border-color:var(--line);background:var(--soft)}
.b-acc{color:var(--acc);border-color:var(--acc-line);background:var(--acc-bg)}
.b-ink{color:var(--ink);border-color:var(--line3);background:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:4px;border:1px solid var(--line3);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--acc-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line3);background:var(--panel);color:var(--ink);font-size:12px;cursor:pointer;font-family:var(--mono)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:5px 12px;font-size:12.5px}
.kv .k{color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.inp{height:28px;border:1px solid var(--line3);border-radius:4px;padding:0 8px;font:inherit;background:var(--panel);color:var(--ink)}
.hint{color:var(--ink3);font-size:12px}
.foot{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px;padding:0 16px 0 0;margin-right:16px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}
.stat .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.callout{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--softer);font-size:12.5px}
.callout.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.callout.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.trust .box{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel)}
.trust .h{font-size:10.5px;font-weight:600;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.code{font-family:var(--mono);font-size:11.5px;background:var(--code-bg);color:var(--code-ink);padding:10px 12px;border-radius:4px;white-space:pre;overflow:auto;line-height:1.5}
.code.wrap{white-space:pre-wrap}
.code .e{color:#e3944a}.code .a{color:#7fb98b}.code .d{color:#d98b84}.code .c{color:#8a867d}
.md{font-size:13px;line-height:1.55;overflow:auto;overflow-wrap:anywhere}
.md h1{font-size:16px;margin:4px 0 10px}.md h2{font-size:14px;margin:16px 0 8px}.md h3,.md h4{font-size:13px;margin:12px 0 6px}
.md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px;padding-left:20px}.md li{margin:2px 0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--line2);padding:0 3px;border-radius:3px}
.md table.t{margin:0 0 12px}.md table.t td{vertical-align:top}.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line2)}
.seg{height:100%}
.grid{display:grid;gap:4px;min-width:0}
.cell{height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--mono)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.c-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.c-mute{background:var(--soft);color:var(--ink3);border-color:var(--line)}
.c-acc{background:var(--acc-bg);color:var(--acc);border-color:var(--acc-line)}
.c-head{background:transparent;color:var(--ink2);font-size:10.5px;cursor:default;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);margin:0}
.rc{cursor:context-menu}
/* ------------------------------------------------------------- overlays ----- */
.veil{position:fixed;inset:0;z-index:40}
.ctx{position:fixed;z-index:41;min-width:230px;max-width:360px;background:var(--panel);border:1px solid var(--line3);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:4px;font-size:12.5px}
.ctx .ttl{padding:5px 10px 6px;color:var(--ink3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .it{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;background:none;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.ctx .it:hover:not(:disabled){background:var(--acc-bg);color:var(--acc)}
.ctx .it:disabled{color:var(--ink3);opacity:.55;cursor:default}
.ctx .it .k{color:var(--ink3);font-family:var(--mono);font-size:11px}
.ctx .sep{height:1px;background:var(--line2);margin:3px 6px}
.cli{display:flex;align-items:center;gap:10px;padding:5px 16px;background:var(--softer);border-top:1px solid var(--line2);font-size:12px;flex:none;min-height:30px}
.cli .d{color:var(--ink3);font-family:var(--mono)}
.cli .c{font-family:var(--mono);color:var(--ink);overflow:auto;white-space:nowrap;flex:1}
.help{position:fixed;z-index:41;right:16px;top:56px;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 120px);background:var(--panel);border:1px solid var(--line3);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;flex-direction:column}
.keys{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:12.5px}
.kb{font-family:var(--mono);font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:1px 6px;display:inline-block}
.err{border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-bottom:12px}
.err .t{font-weight:600;color:var(--bad);display:flex;gap:8px;align-items:center}
.err .k{color:var(--ink2);width:56px;display:inline-block;flex:none}
.err .row{display:flex;gap:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);padding:36px 20px;text-align:center}
.empty .t{font-weight:600;color:var(--ink)}
.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--line2),var(--soft),var(--line2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.q{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid var(--line3);color:var(--ink3);font-size:10px;align-items:center;justify-content:center;margin-left:6px;cursor:help;vertical-align:middle}
.prog{display:flex;align-items:center;gap:10px;padding:7px 13px;border:1px solid var(--acc-line);background:var(--acc-bg);border-radius:4px;font-size:12.5px;margin-bottom:12px}
.prog .bar{flex:1;max-width:260px}
.pal{position:fixed;z-index:42;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line3);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.28);overflow:hidden}
.pal input{width:100%;height:40px;border:0;border-bottom:1px solid var(--line2);padding:0 14px;font:inherit;font-size:14px;background:var(--panel);color:var(--ink)}
.pal input:focus{outline:none}
.pal .list{max-height:44vh;overflow:auto;padding:4px}
.pal .it{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:3px;cursor:pointer;background:none;border:0;width:100%;font:inherit;color:inherit;text-align:left}
.pal .it.on,.pal .it:hover{background:var(--acc-bg);color:var(--acc)}
svg.chart{display:block;width:100%;height:auto;font-family:var(--mono);font-size:10px}
.drop{border:1.5px dashed var(--line3);border-radius:6px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink2);padding:18px;text-align:center}
.drop.over{border-color:var(--acc);background:var(--acc-bg)}
.rowflex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
@media (max-width:1100px){.col{min-width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="nav" id="nav"></div>
  <div class="main" id="main"></div>
  <div class="cli" id="cli"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="overlays"></div>
<script>
"use strict";
/* =========================================================================
   pmukit web shell -- one page, eight screens, no framework and no build.
   Everything the page knows comes from the routes in docs/OVERNIGHT_BRIEF.md.
   ========================================================================= */

/* --------------------------------------------------------------- state --- */
var S = {
  screen: "home",
  project: "",
  demo: false,
  data: {},          /* cache key -> payload                                */
  loading: {},       /* cache key -> true while in flight                   */
  slow: {},          /* cache key -> true after 2 s (the "what is happening")*/
  errs: {},          /* screen   -> {status, error, retry}                  */
  sel: {},           /* per-screen selections                               */
  menu: null,
  help: null,
  palette: false,
  job: null,         /* {job, status, message, progress, title}             */
  undoable: "",
  toast: "",
  prev: "home"       /* the screen Settings goes back to                    */
};

var ICON = {
  ok: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>',
  warn: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5l6 11H2z"/><path d="M8 7v3"/><path d="M8 12.2v.1"/></svg>',
  x: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  file: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/></svg>',
  play: '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',
  copy: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5v-3h-8v8h3"/></svg>',
  retry: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg>',
  arrow: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>',
  up: '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3.5M4.5 7L8 3.5 11.5 7"/><path d="M2.5 11.5v2h11v-2"/></svg>'
};

var STEPS = [["0","Home","home"],["1","New","new"],["2","Plan","plan"],["3","Run","run"],
             ["4","Model","model"],["5","Deliver","deliver"]];

/* ------------------------------------------------------------- helpers --- */
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function el(id){ return document.getElementById(id); }
function num(x, d){ d = d === undefined ? 2 : d; var v = Number(x); return isFinite(v) ? v.toFixed(d) : "-"; }
function eng(x, unit){
  unit = unit || "";
  var v = Number(x);
  if (!isFinite(v) || v === 0) return "0 " + unit;
  var sign = v < 0 ? "-" : ""; v = Math.abs(v);
  var tab = [[12,"T"],[9,"G"],[6,"M"],[3,"k"],[0,""],[-3,"m"],[-6,"u"],[-9,"n"],[-12,"p"],[-15,"f"]];
  for (var i = 0; i < tab.length; i++){
    if (v >= Math.pow(10, tab[i][0]) || tab[i][0] === -15){
      var s = (v / Math.pow(10, tab[i][0])).toPrecision(4).replace(/\.?0+$/,"");
      return (sign + s + " " + tab[i][1] + unit).trim();
    }
  }
  return sign + v + " " + unit;
}
function ago(iso){
  if (!iso) return "-";
  var t = Date.parse(String(iso).replace(" ","T"));
  if (!isFinite(t)) return String(iso);
  var s = (Date.now() - t) / 1000;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 172800) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
}
function copy(text){
  var ok = function(){ S.toast = "copied"; render(); setTimeout(function(){ S.toast=""; render(); }, 1400); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); return; }
  } catch(e){ /* fall through */ }
  fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch(e2){ S.toast = "press Ctrl C"; render(); }
    document.body.removeChild(ta);
  }
}
/* Five states, not four. "fitted" is what a block is before `verify` has judged it against a
   limit: it was measured and fitted, and that is all anyone can honestly say yet. It gets its
   own neutral colour so it can never be mistaken for a pass. */
function gradeCls(g){
  return g === "green" || g === "ok" ? "ok" : g === "yellow" || g === "warn" ? "warn"
       : g === "red" || g === "bad" ? "bad" : g === "fitted" ? "acc" : "mute";
}
function gradeLabel(g){
  return g === "green" || g === "ok" ? "OK" : g === "yellow" || g === "warn" ? "MARG"
       : g === "red" || g === "bad" ? "FAIL" : g === "fitted" ? "FIT" : "N/R";
}

/* ----------------------------------------------------------------- api --- */
function api(path, opts){
  opts = opts || {};
  var init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined){
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  return fetch(path, init).then(function(r){
    return r.text().then(function(txt){
      var data = null;
      try { data = txt ? JSON.parse(txt) : {}; } catch(e){ data = { raw: txt }; }
      if (!r.ok){
        var e4 = (data && data.error) || {
          what: "the server answered " + r.status + " for " + path + ".",
          why: "The response carried no four-part error, which means it did not come from a "
             + "pmukit route handler.",
          do: ["Reload the page", "Check the server console"],
          where: path
        };
        throw { status: r.status, error: e4, path: path };
      }
      return data;
    });
  }, function(netErr){
    throw { status: 0, path: path, error: {
      what: "the page could not reach the pmukit server.",
      why: "fetch(" + path + ") failed: " + netErr + ". The server process is gone, or the "
         + "machine went to sleep while the page stayed open.",
      do: ["Restart `pmukit ui` in the terminal", "Reload the page"],
      where: path } };
  });
}

/* A cached GET tied to a screen. Renders skeletons while in flight, a four-part error on
   failure, and marks the request "slow" after 2 s so the screen can say what it is doing. */
function need(key, path, screen){
  if (S.data[key] !== undefined || S.loading[key]) return S.data[key];
  S.loading[key] = true;
  var timer = setTimeout(function(){ S.slow[key] = true; render(); }, 2000);
  api(path).then(function(d){
    clearTimeout(timer);
    S.loading[key] = false; S.slow[key] = false; S.data[key] = d;
    if (S.errs[screen] && S.errs[screen].key === key) delete S.errs[screen];
    render();
  }, function(e){
    clearTimeout(timer);
    S.loading[key] = false; S.slow[key] = false;
    S.errs[screen] = { status: e.status, error: e.error, key: key,
                       retry: function(){ delete S.data[key]; delete S.errs[screen]; render(); } };
    render();
  });
  return undefined;
}
function forget(prefix){
  Object.keys(S.data).forEach(function(k){ if (k.indexOf(prefix) === 0) delete S.data[k]; });
  Object.keys(S.loading).forEach(function(k){ if (k.indexOf(prefix) === 0) delete S.loading[k]; });
}
function P(){ return encodeURIComponent(S.project); }

/* ---------------------------------------------------------------- jobs --- */
function startJob(promise, title, onDone, onStart){
  promise.then(function(d){
    if (!d || !d.job){ if (onDone) onDone(d); render(); return; }
    S.job = { job: d.job, status: "running", progress: 0, message: "starting", title: title };
    if (onStart) onStart(d);
    render();
    poll(d.job, onDone);
  }, function(e){ showErr(e); });
}
function poll(id, onDone){
  api("/api/jobs/" + encodeURIComponent(id)).then(function(j){
    S.job = { job: j.job, status: j.status, progress: j.progress, message: j.message,
              title: j.title, error: j.error, not_landed: j.not_landed, result: j.result };
    render();
    if (j.status === "running" || j.status === "queued"){ setTimeout(function(){ poll(id, onDone); }, 700); return; }
    if (j.status === "failed"){
      S.errs[S.screen] = { status: 501, error: j.error, retry: function(){ S.job = null; render(); } };
    }
    if (onDone) onDone(j);
    render();
  }, function(e){ showErr(e); });
}
function showErr(e){
  S.errs[S.screen] = { status: e.status, error: e.error,
                       retry: function(){ delete S.errs[S.screen]; render(); } };
  render();
}

function verbsFor(kind, ctx){
  return (VERBS[kind] || []).filter(function(v){
    if (v.sep) return true;
    return v.when ? v.when(ctx) !== false : true;
  });
}
function verbLabel(v, ctx){ return typeof v.label === "function" ? v.label(ctx) : v.label; }

/* Buttons: the two or three common verbs of an object, same source as its menu. */
function verbButtons(kind, ctx, cls){
  return verbsFor(kind, ctx).filter(function(v){ return v.common; }).map(function(v, i){
    var id = regAction(function(){ v.run(ctx); });
    return '<button class="btn sm ' + (cls || "") + '" data-act="' + id + '">'
         + esc(verbLabel(v, ctx)) + "</button>";
  }).join(" ");
}
/* One named verb, rendered as a button -- same table, so a row button cannot drift from its menu. */
function verbButton(kind, ctx, verbId, cls){
  var v = verbsFor(kind, ctx).filter(function(x){ return x.id === verbId; })[0];
  if (!v) return "";
  var id = regAction(function(){ v.run(ctx); });
  return '<button class="btn sm ' + (cls || "") + '" data-act="' + id + '">'
       + esc(verbLabel(v, ctx)) + "</button>";
}

/* Menu: every verb of the object. */
function openMenu(ev, kind, title, ctx){
  ev.preventDefault(); ev.stopPropagation();
  S.menu = { kind: kind, title: title, ctx: ctx, x: ev.clientX, y: ev.clientY };
  render();
}
function rc(kind, title, ctxName){
  /* the attributes that wire one object to its context menu. No class: the caller owns the
     class attribute, and two class attributes on one tag would silently lose the first. */
  return ' data-menu="' + esc(kind) + '" data-menutitle="' + esc(title)
       + '" data-menuctx="' + esc(ctxName) + '"';
}

/* Action registry: HTML strings cannot carry closures, so handlers are registered per render. */
var ACTS = {}, ACTN = 0;
function regAction(fn){ var id = "a" + (++ACTN); ACTS[id] = fn; return id; }
var CTXS = {}, CTXN = 0;
function regCtx(obj){ var id = "c" + (++CTXN); CTXS[id] = obj; return id; }

/* ------------------------------------------------------------ navigation - */
function go(screen){
  /* Settings is the machine's, not a step of the project: it remembers where it was opened
     from, and it is never written into the project's state.json. */
  if (screen === "settings" && S.screen !== "settings") S.prev = S.screen;
  S.screen = screen;
  delete S.errs[screen];
  if (S.project && !S.demo && screen !== "settings"){
    api("/api/state/" + P(), { method:"PUT", body:{ screen: screen } }).then(function(){}, function(){});
  }
  render();
  refreshCli();
}
function openProject(name, screen){
  S.project = name;
  S.data = {}; S.loading = {}; S.errs = {}; S.sel = {};
  go(screen || "new");
}
/* New project: the name field in the Home footer. This fills and focuses it; Enter or the
   button creates the folder. A refusal (bad name, already there) is shown next to the field. */
function newProject(suggested){
  if (S.screen !== "home") go("home");
  if (suggested) S.sel.newName = suggested;
  S.sel.newErr = null;
  render();
  var n = el("newname");
  if (n && n.focus){ n.focus(); if (n.select) n.select(); }
}
function createProject(){
  var n = el("newname");
  var name = String(n ? n.value : (S.sel.newName || "")).trim();
  S.sel.newName = name;
  if (!name){
    S.sel.newErr = { what: "type a name for the project first.",
      why: "A project is a folder under PMUKIT_DATA; the name is the folder's name.",
      do: ["Use a name like demo_pmu"], where: "Home > new project name" };
    render(); return;
  }
  api("/api/projects", { method:"POST", body:{ name: name } }).then(function(d){
    S.sel.newName = ""; S.sel.newErr = null;
    forget("projects");
    openProject(d.project, "new");
  }, function(e){ S.sel.newErr = e.error; render(); });
}
/* Open the latest deliverable's report.md. With nothing delivered yet the Deliver screen says
   so and offers to deliver. */
function openReport(name){
  if (name && name !== S.project) openProject(name, "deliver"); else go("deliver");
  S.sel.deliv = 0; S.sel.file = "report.md"; S.sel.wantReport = true;
  forget("deliverables"); forget("dfile:");
  render(); refreshCli();
}

/* ------------------------------------------------------------- rendering - */
function render(){
  /* A field marked data-keepfocus keeps the cursor across a re-render (a job poll or a probe
     landing must not steal the name being typed). */
  var ae = document.activeElement;
  var keep = ae && ae.getAttribute && ae.getAttribute("data-keepfocus") ? ae.id : "";
  var caret = keep ? ae.selectionStart : 0;
  ACTS = {}; CTXS = {};
  renderNav();
  var sc = SCREENS[S.screen] || SCREENS.home;
  el("main").innerHTML = sc.main();
  el("foot").innerHTML = sc.foot ? sc.foot() : "";
  renderCli();
  renderOverlays();
  wire();
  var kn = keep ? el(keep) : null;
  if (kn && kn.focus){ kn.focus(); try { kn.setSelectionRange(caret, caret); } catch(e){ /* not a text field */ } }
}
function renderNav(){
  var steps = STEPS.map(function(s, i){
    var cur = S.screen === s[2];
    var idx = STEPS.map(function(x){ return x[2]; }).indexOf(S.screen);

         + '<span class="n">' + s[0] + "</span><span>" + s[1] + "</span></button>";
  }).join("");
  var extra = "";
  if (S.screen === "digest") extra = '<span class="badge b-acc">4b Copy for desk</span>';
  if (S.screen === "states") extra = '<span class="badge b-mute">reference sheet</span>';
  if (S.screen === "settings") extra = '<span class="badge b-mute">this machine, every project</span>';
  el("nav").innerHTML =
      '<button class="brand" data-go="home" title="Home: every project (key 0)">pmukit</button>'
    + '<span class="proj">' + esc(S.project || "no project") + (S.demo ? " &middot; demo" : "") + "</span>"
    + '<div class="steps">' + steps + "</div>"
    + '<div class="navr">' + extra
    + (S.toast ? '<span class="badge b-ok">' + esc(S.toast) + "</span>" : "")
    + '<span class="hint">' + (S.undoable ? "Ctrl Z undoes: " + esc(S.undoable) : "") + "</span>"
    + '<button class="btn sm' + (S.screen === "settings" ? " pri" : "") + '" data-go="settings" '
    + 'title="Where runs go: engine, simulator, queue, CPUs and the Donau accounts of this machine">Settings</button>'
    + '<button class="btn sm" data-help="1" title="Help and keyboard shortcuts (?)">? Help</button>'
    + "</div>";
}

        + esc(h.title || "Help") + '</span><button class="btn sm" data-close="help">Close &middot; Esc</button></div>'

function wire(){
  document.querySelectorAll("[data-act]").forEach(function(n){
    n.onclick = function(e){ e.stopPropagation(); var f = ACTS[n.getAttribute("data-act")]; if (f) f(); };
  });
  document.querySelectorAll("[data-change]").forEach(function(n){
    n.onchange = function(){ var f = ACTS[n.getAttribute("data-change")]; if (f) f(n.value); };
  });
  /* Enter in a text box runs its action (data-enter="<action>"); data-keep / data-input
     ="<S.sel key>" keep what was typed across a re-render (two spellings, one behaviour). */
  document.querySelectorAll("[data-enter]").forEach(function(n){
    n.onkeydown = function(e){
      if (e.key !== "Enter") return;
      e.preventDefault(); var f = ACTS[n.getAttribute("data-enter")]; if (f) f(n.value);
    };
  });
  document.querySelectorAll("[data-keep],[data-input]").forEach(function(n){
    var key = n.getAttribute("data-keep") || n.getAttribute("data-input");
    n.oninput = function(){ S.sel[key] = n.value; };
  });
  document.querySelectorAll("[data-go]").forEach(function(n){
    n.onclick = function(){ go(n.getAttribute("data-go")); };
  });
  document.querySelectorAll("[data-close]").forEach(function(n){
    n.onclick = function(){
      var w = n.getAttribute("data-close");
      if (w === "menu") S.menu = null;
      if (w === "help") S.help = null;
      if (w === "palette"){ S.palette = false; S.paletteQ = ""; }
      render();
    };
  });
  document.querySelectorAll("[data-menu]").forEach(function(n){
    n.oncontextmenu = function(e){
      openMenu(e, n.getAttribute("data-menu"), n.getAttribute("data-menutitle"),
               CTXS[n.getAttribute("data-menuctx")] || {});
    };
  });
  var cc = document.querySelector("[data-copycli]");
  if (cc) cc.onclick = function(){ copy(S.cli); };
  var hb = document.querySelector("[data-help]");
  if (hb) hb.onclick = function(){ openHelp(); };
  document.querySelectorAll("[data-chart]").forEach(hoverChart);
}

function panel(title, sub, body, opts){
  opts = opts || {};
  return '<div class="panel" style="' + (opts.style || "flex:1") + '"><div class="ph"><span>'
       + title + "</span>" + (sub ? '<span class="sub">' + sub + "</span>" : (opts.right || ""))
       + '</div><div class="pb' + (opts.flush ? " flush" : "") + '" style="' + (opts.bodyStyle || "") + '">'
       + body + "</div></div>";
}
function skeleton(rows, what){
  var lines = "";
  for (var i = 0; i < (rows || 5); i++){
    lines += '<div class="skel" style="width:' + (55 + ((i * 37) % 40)) + '%;margin-bottom:9px"></div>';
  }
  return '<div style="padding:4px 0">' + lines
       + (what ? '<div class="hint" style="margin-top:8px">' + esc(what) + "</div>" : "") + "</div>";
}
function loadingBlock(key, what){
  return skeleton(6, S.slow[key] ? what : "");
}
function emptyBlock(title, text, btnLabel, btnGo){
  return '<div class="empty"><span style="color:var(--ink3)">' + ICON.file + "</span>"
       + '<div class="t">' + esc(title) + "</div><div>" + esc(text) + "</div>"
       + (btnLabel ? '<button class="btn" style="margin-top:6px" data-go="' + btnGo + '">'
                     + esc(btnLabel) + "</button>" : "") + "</div>";
}
/* The four-part error, with the Do actions as real buttons. The table that produced it is
   rendered underneath, never replaced. `pick` is an optional row of controls a screen offers
   to fix the error in place (the New screen's PMU instance picker). */
function errBlock(screen, pick){
  var e = S.errs[screen];
  if (!e) return "";
  var er = e.error || {};
  var dos = (er.do || []).map(function(d){
    var id = regAction(function(){ doAction(d, e); });
    return '<button class="btn sm" data-act="' + id + '">' + esc(d) + "</button>";
  }).join(" ");
  var rid = regAction(function(){ if (e.retry) e.retry(); });
  return '<div class="err"><div class="t">' + ICON.x + " " + esc(er.what || "something failed")
       + (e.status ? ' <span class="badge b-bad">' + e.status + "</span>" : "") + "</div>"
       + '<div class="row"><span class="k">What</span><span>' + esc(er.what || "") + "</span></div>"
       + '<div class="row"><span class="k">Why</span><span>' + esc(er.why || "") + "</span></div>"
       + '<div class="row"><span class="k">Do</span><span class="rowflex">' + dos
       + '<button class="btn sm" data-act="' + rid + '">' + ICON.retry + " Try again</button></span></div>"
       + (pick ? '<div class="row"><span class="k">Pick</span><span class="rowflex">' + pick + "</span></div>" : "")
       + '<div class="row"><span class="k">Where</span><span class="mono">' + esc(er.where || "-") + "</span></div>"
       + "</div>";
}
function doAction(text, e){
  var t = String(text || "");
  if (/pmu instance/i.test(t) && el("instpick")) return el("instpick").focus();
  if (/path on this machine/i.test(t) && el("nlpath")) return el("nlpath").focus();
  if (/new screen/i.test(t)) return go("new");
  if (/plan screen/i.test(t)) return go("plan");
  if (/run screen/i.test(t)) return go("run");
  if (/model screen/i.test(t)) return go("model");
  if (/\bhome\b/i.test(t)) return go("home");
  if (/\bsettings\b/i.test(t)) return go("settings");
  if (/reload/i.test(t)) return window.location.reload();
  if (/try again|retry/i.test(t)){ if (e && e.retry) return e.retry(); }
  copy(t);
}
function jobBlock(){
  if (!S.job) return "";
  var j = S.job, pct = Math.round((j.progress || 0) * 100);
  var cls = j.status === "failed" ? "bad" : j.status === "partial" ? "warn" : "";
  var id = regAction(function(){ S.job = null; render(); });
  return '<div class="prog" style="' + (cls === "bad" ? "border-color:var(--bad-line);background:var(--bad-bg)"
        : cls === "warn" ? "border-color:var(--warn-line);background:var(--warn-bg)" : "") + '">'
       + "<b>" + esc(j.title || j.job) + "</b>"
       + '<div class="bar"><div class="seg" style="background:var(--acc);width:' + pct + '%"></div></div>'
       + '<span class="hint">' + esc(j.message || j.status) + "</span>"
       + (j.status === "running" ? "" : '<button class="btn sm" data-act="' + id + '">Dismiss</button>')
       + "</div>";
}

/* When the guess fails there is no pin table to put the row in: the error offers the choice. */
function errInstPicker(){
  var e = S.errs.new;
  var cands = e && e.error && e.error.candidates;
  if (!cands || !cands.length) return "";
  var act = regAction(function(){ var p = el("instpick"); if (p && p.value) setInstance(p.value); });
  return '<select class="inp mono" id="instpick">' + instOptions(cands, cands[0].name) + "</select>"
    + '<button class="btn sm pri" data-act="' + act + '">Use this instance</button>';
}
function setInstance(name){
  api("/api/p/" + P() + "/netlist/instance", { method:"PUT", body:{ pmu_inst: name } })
    .then(function(){
      delete S.errs.new; S.job = null;
      forget("pins"); forget("config"); forget("derived"); forget("plan"); forget("consequences");
      forget("netlistsrc");
      render(); refreshCli();
    }, showErr);
}
function scanNotes(pins){
  var notes = pins.notes || [];
  if (!notes.length) return "";
  return '<div class="callout" style="margin-top:10px"><b>What the scan noticed</b>'
    + '<ul style="margin:6px 0 0 18px;padding:0">' + notes.map(function(n){
        return '<li style="margin-bottom:3px">' + esc(n) + "</li>"; }).join("") + "</ul></div>";
}
/* Set role, inline: the DC value is asked for in the page, not in a browser dialog. */
function roleAskBlock(){
  var a = S.sel.roleAsk;
  if (!a) return "";
  var pre = { rail:"IL_", bias:"VB_", supply:"VS_", en:"VEN_" }[a.role] || "";
  var unit = a.role === "rail" ? "A, typical load current" : "V, compliance / level";
  var go1 = regAction(function(v){
    var txt = typeof v === "string" ? v : (el("roledc") || {}).value;
    S.sel.roleAsk = null;
    setPin(a.pin, { role: a.role, dc: parseEng(txt) });
  });
  var cancel = regAction(function(){ S.sel.roleAsk = null; render(); });
  return '<div class="callout" style="margin-bottom:10px"><div class="rowflex">'
    + "<b>Set " + esc(a.pin) + " as " + esc(a.role) + "</b>"
    + '<span class="hint">DC (' + unit + ")</span>"
    + '<input class="inp mono" id="roledc" style="width:92px" data-enter="' + go1 + '" value="'
    + (a.role === "rail" ? "500u" : a.role === "bias" ? "0.4" : "1") + '">'
    + '<button class="btn sm pri" data-act="' + go1 + '">Write ' + esc(pre + a.pin) + " into the netlist</button>"
    + '<button class="btn sm" data-act="' + cancel + '">Cancel</button></div>'
    + '<div class="hint" style="margin-top:6px">This edits pmukit\'s working copy. Add the same source to '
    + "the bench in Virtuoso too, or the next re-read of a changed export will not have it.</div></div>";
}
function netlistBody(pins, info){
  var nl = pins.netlist || {};
  var rows = (pins.pins || []).map(function(p){
    var ctx = regCtx({ row: p });
    var canModel = p.role === "rail" || p.role === "bias";
    var tid = regAction(function(){ setPin(p.name, { fate: p.fate === "model" ? "stub" : "model" }); });
    var fateCls = p.fate === "model" ? "b-acc" : p.fate === "stub" ? "b-ink" : "b-mute";
    var fateTxt = p.fate === "stub"
      ? "stub &middot; ideal " + (p.role === "rail" ? "V" : "I") : esc(p.fate);
    return '<tr class="rc"' + rc("pin", "pin " + p.name, ctx) + ">"
      + "<td>" + (canModel ? '<input type="checkbox" data-act="' + tid + '"'
          + (p.fate === "model" ? " checked" : "") + ">" : "") + "</td>"
      + '<td class="mono">' + esc(p.name) + "</td>"
      + '<td class="mono" style="color:var(--ink2)">' + esc(p.net) + "</td>"
      + '<td><span class="badge ' + (p.role === "none" ? "b-warn" : p.is_ground ? "b-mute" : "b-acc")
      + '">' + esc(p.is_ground ? "ground" : p.role) + "</span></td>"
      + '<td class="mono">' + esc(p.src || "-") + "</td>"
      + "<td>" + (p.dc === null || p.dc === undefined ? "-"
          : esc(eng(p.dc, p.role === "rail" ? "A" : "V"))) + "</td>"
      + '<td><span class="badge ' + fateCls + '">' + fateTxt + "</span></td></tr>";
  }).join("");
  var unc = (pins.summary || {}).unclassified || [];
  var srcInfo = info || { source: null, copy: { path: nl.path, bytes: nl.bytes, sha: nl.sha } };
  return '<div class="kv" style="margin-bottom:12px">'
    + netlistSourceKv(srcInfo)
    + '<span class="k">PMU instance</span><span class="rowflex">' + instPicker(pins)
    + '<span>cell <span class="mono">' + esc(pins.pmu_master) + "</span> &middot; "
    + (pins.pins || []).length + " pins</span></span>"
    + '<span class="k">PDK includes</span><span class="mono">'
    + esc(Object.keys(pins.sections || {}).map(function(k){ return k + " section=" + pins.sections[k]; }).join(" &middot; ") || "-")
    + "</span>"
    + '<span class="k">Parameters</span><span class="mono">'
    + esc(Object.keys(pins.params || {}).map(function(k){ return k + "=" + pins.params[k]; }).join(" ") || "-") + "</span>"
    + '<span class="k">Analyses in file</span><span>' + (pins.analyses || []).length
    + " found &middot; stripped, pmukit writes its own</span></div>"
    + (S.sel.loadAnother ? '<div style="margin-bottom:12px">' + dropZone(srcInfo) + "</div>" : "")
    + roleAskBlock()
    + '<table class="t"><thead><tr><th style="width:26px" title="Model this port? Unticked rails and biases become stubs.">Model</th>'
    + "<th>Pin</th><th>Net</th><th>Role</th><th>From source</th><th>DC</th><th>Fate</th></tr></thead>"
    + "<tbody>" + rows + "</tbody></table>"
    + scanNotes(pins)
    + (unc.length ? '<div class="callout warn" style="margin-top:10px">' + ICON.warn + " <b>"
        + esc(unc.join(", ")) + "</b> " + (unc.length > 1 ? "have" : "has")
        + " no IL_ / VB_ / VS_ / VEN_ source, so no role, and "
        + (unc.length > 1 ? "are" : "is") + " left exactly as wired. Right-click the pin to set a "
        + "role; pmukit writes the named source into the netlist for you.</div>" : "")
    + '<div class="callout" style="margin-top:8px">' + ICON.ok
    + " <b>You decide which ports get modeled.</b> Ticked = characterized and fitted. Unticked "
    + "rail or bias = <b>stub</b>: the pin stays on the symbol, emitted as an ideal source at its "
    + "DC value, zero runs.</div>";
}
function vsetParamPicker(cfg, pins){
  // The name is the designer's, not pmukit's: offer what the netlist declares, keep a name the
  // netlist does not declare visible (plan refuses it when more than one code is asked for).
  var cur = cfg.vset_param || "VSET";
  var names = Object.keys((pins && pins.params) || {});
  var act = regAction(function(v){
    patchConfig("vset_param", (typeof v === "string" ? v : el("vsetparam").value).trim()); });
  if (!names.length){
    return '<input class="inp mono" id="vsetparam" style="width:120px" value="' + esc(cur) + '">'
      + '<button class="btn sm" data-act="' + act + '">Set</button>';
  }
  if (names.indexOf(cur) < 0) names.unshift(cur);
  return '<select class="inp mono" id="vsetparam" data-change="' + act + '">'
    + names.map(function(n){
        var val = (pins.params || {})[n];
        return '<option value="' + esc(n) + '"' + (n === cur ? " selected" : "") + ">" + esc(n)
          + (val === undefined ? "  (not in netlist)" : " = " + esc(val)) + "</option>";
      }).join("") + "</select>";
}
function threeQuestions(cfgd, pins){
  var cfg = cfgd.config;
  if (!cfg){
    return emptyBlock("No configuration yet",
      "Load a netlist first: pmukit seeds the three answers from what the deck already says.",
      "", "");
  }
  S.undoable = cfgd.undoable || "";
  var corners = (cfg.corners instanceof Array) ? cfg.corners : Object.keys(cfg.corners || {});
  var chips = function(list, all, key){
    return list.map(function(v){
      var on = all.indexOf(v) >= 0;
      var ctx = regCtx({ row: { name: v },
        only: function(){ patchConfig(key, [v]); },
        all: function(){ patchConfig(key, list); },
        remove: function(){ patchConfig(key, all.filter(function(x){ return x !== v; })); } });
      var id = regAction(function(){
        patchConfig(key, on ? all.filter(function(x){ return x !== v; }) : all.concat([v]));
      });
      return '<button class="chip rc' + (on ? " on" : "") + '" data-act="' + id + '"'
           + rc("corner", key + " " + v, ctx) + ">" + esc(v) + "</button>";
    }).join(" ");
  };
  var railRows = Object.keys(cfg.my_load || {}).map(function(r){
    var ld = cfg.my_load[r];
    var ctx = regCtx({ row: { name: r, on_a: ld.on_a, switches: ld.switches } });
    var sw = regAction(function(){ toggleSwitch(r); });
    return '<tr class="rc"' + rc("rail", "rail " + r, ctx) + ">"
      + '<td class="mono">' + esc(r) + "</td>"
      + '<td><input class="inp mono" style="width:92px;height:24px" data-load="' + esc(r)
      + '" data-k="on_a" value="' + esc(eng(ld.on_a, "A")) + '"></td>'
      + '<td><input class="inp mono" style="width:92px;height:24px" data-load="' + esc(r)
      + '" data-k="off_a" value="' + esc(eng(ld.off_a, "A")) + '"></td>'
      + '<td><input type="checkbox" data-act="' + sw + '"' + (ld.switches ? " checked" : "")
      + '> <span class="hint">' + (ld.switches ? "load-EN characterized" : "static load only")
      + "</span></td>"
      + "<td>" + verbButtons("rail", CTXS[ctx]) + "</td></tr>";
  }).join("");
  var save = regAction(function(){ saveLoadsFromInputs(); });
  var undo = regAction(function(){ doUndo(); });
  var known = ["tt","ss","ff","fs","sf"];
  var kt = [-40, 0, 25, 85, 125];
  return '<div style="display:flex;flex-direction:column;gap:16px">'
    + '<div class="field"><span class="lbl">1 &middot; Corners, temperatures and VSET codes'
    + '<span class="q" title="pmukit rewrites the PDK include section= per corner and sets options temp= per temperature. Temperature is continuous inside the model.">?</span></span>'
    + '<div class="rowflex"><span class="hint" style="width:66px">corners</span>'
    + chips(known.concat(corners.filter(function(c){ return known.indexOf(c) < 0; })), corners, "corners") + "</div>"
    + '<div class="rowflex"><span class="hint" style="width:66px">temp C</span>'
    + chips(kt.concat(cfg.temps_c.filter(function(t){ return kt.indexOf(t) < 0; })).map(String),
            cfg.temps_c.map(String), "temps_c") + "</div>"
    + '<div class="rowflex"><span class="hint" style="width:66px">code var</span>'
    + vsetParamPicker(cfg, pins)
    + '<span class="hint">the design variable that selects the output code; rewritten as '
    + '<span class="mono">parameters ' + esc(cfg.vset_param || "VSET") + '=&lt;code&gt;</span></span></div>'
    + '<div class="rowflex"><span class="hint" style="width:66px">codes</span>'
    + '<input class="inp mono" id="vsetinp" style="width:92px" value="' + esc(cfg.vset_codes.join(",")) + '">'
    + '<button class="btn sm" data-act="' + regAction(function(){
        patchConfig("vset_codes", el("vsetinp").value.split(",").map(function(s){
          return parseInt(s.trim(), 10); }).filter(function(n){ return !isNaN(n); }));
      }) + '">Set</button></div></div>'
    + '<div class="field"><span class="lbl">2 &middot; What your block draws from each rail'
    + '<span class="q" title="On/off currents set the characterization grid (off, 0.2x on, on, 2x on). Switches = your block turns on and off during simulation.">?</span></span>'
    + (railRows ? '<table class="t"><thead><tr><th>Rail</th><th>On</th><th>Off</th>'
        + "<th>Switches on/off</th><th></th></tr></thead><tbody>" + railRows + "</tbody></table>"
        + '<div class="rowflex"><button class="btn sm" data-act="' + save + '">Save the load numbers</button>'
        + '<span class="hint">Only ports ticked Model appear here.</span></div>'
      : '<div class="hint">No rail is set to Model yet. Tick one in the pin table.</div>')
    + "</div>"
    + '<div class="field"><span class="lbl">3 &middot; Highest frequency you care about'
    + '<span class="q" title="Zout and PSRR are characterized up to this frequency and never extrapolated past it.">?</span></span>'
    + '<div class="rowflex"><input class="inp mono" id="fmaxinp" style="width:120px" value="'
    + esc(eng(cfg.care_up_to_hz, "Hz")) + '">'
    + '<button class="btn sm" data-act="' + regAction(function(){
        var v = parseEng(el("fmaxinp").value);
        if (v) patchConfig("care_up_to_hz", v);
      }) + '">Set</button>'
    + '<span class="hint">Zout and PSRR are characterized up to here and never extrapolated past it.</span>'
    + "</div></div>"
    + '<div class="rowflex"><button class="btn sm" data-act="' + undo + '"'
    + (cfgd.undoable ? "" : " disabled") + ">" + ICON.retry + " Undo (Ctrl Z)</button>"
    + '<button class="btn sm" data-act="' + regAction(function(){
        S.sel.showDerived = !S.sel.showDerived;
        if (S.sel.showDerived) need("derived", "/api/p/" + P() + "/config/derived", "new");
        render(); }) + '">'
    + (S.sel.showDerived ? "Hide" : "Show") + " derived settings (pmukit decided these)</button>"
    + '<span class="hint mono">config sha ' + esc((cfgd.sha || "").slice(0, 8)) + "</span></div>"
    + (S.sel.showDerived ? derivedBlock() : "")
    + "</div>";
}
function derivedBlock(){
  var d = S.data["derived"];
  if (d === undefined) return skeleton(4, "deriving the characterization settings");
  return '<div class="code wrap" style="max-height:260px">' + esc(JSON.stringify(d.derived, null, 1)) + "</div>";
}
function parseEng(text){
  var m = String(text || "").trim().match(/^([-+0-9.eE]+)\s*([TGMkmunpf]?)/);
  if (!m) return 0;
  var mult = { T:1e12, G:1e9, M:1e6, k:1e3, "":1, m:1e-3, u:1e-6, n:1e-9, p:1e-12, f:1e-15 };
  return parseFloat(m[1]) * (mult[m[2]] === undefined ? 1 : mult[m[2]]);
}
function pickFile(){
  var inp = el("fileinp");
  if (!inp) return;
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){ loadNetlist({ text: String(rd.result), name: f.name }); };
    rd.readAsText(f);
  };
  inp.click();
}
function loadNetlist(body){
  delete S.errs.new;
  startJob(api("/api/p/" + P() + "/netlist", { method:"POST", body: body }),
           body.reread ? "re-reading the netlist" : "parsing the netlist",
           function(j){
             if (j && j.status === "done") S.sel.loadAnother = false;
             /* Try again = read it again: the bench was fixed and exported to the same place */
             if (j && j.status === "failed" && S.errs.new) S.errs.new.retry = function(){ loadNetlist(body); };
             forget("pins"); forget("config"); forget("derived"); forget("plan"); forget("consequences");
             forget("netlistsrc");
             render();
           });
}
function setPin(pin, body){
  api("/api/p/" + P() + "/pins/" + encodeURIComponent(pin), { method:"PUT", body: body })
    .then(function(){
      forget("pins"); forget("config"); forget("derived"); forget("plan"); forget("netlistsrc"); render();
    }, showErr);
}
function askRole(pin, role){
  S.sel.roleAsk = { pin: pin.name, role: role };
  render();
  if (el("roledc")) el("roledc").focus();
}
function patchConfig(key, value){
  var cur = (S.data["config"] || {}).config;
  if (!cur) return;
  var next = JSON.parse(JSON.stringify(cur));
  if (key === "temps_c") value = value.map(Number);
  next[key] = value;
  putConfig(next, key + " changed");
}
function toggleSwitch(rail){
  var cur = (S.data["config"] || {}).config;
  if (!cur || !cur.my_load[rail]) return;
  var next = JSON.parse(JSON.stringify(cur));
  next.my_load[rail].switches = !next.my_load[rail].switches;
  putConfig(next, rail + " load-EN toggled");
}
function saveLoadsFromInputs(){
  var cur = (S.data["config"] || {}).config;
  if (!cur) return;
  var next = JSON.parse(JSON.stringify(cur));
  document.querySelectorAll("[data-load]").forEach(function(n){
    var rail = n.getAttribute("data-load"), k = n.getAttribute("data-k");
    var v = parseEng(n.value);
    if (next.my_load[rail] && v) next.my_load[rail][k] = v;
  });
  putConfig(next, "load numbers edited");
}
function putConfig(cfg, note){
  api("/api/p/" + P() + "/config", { method:"PUT", body:{ config: cfg, note: note } })
    .then(function(d){
      S.data["config"] = { exists:true, config:d.config, sha:d.sha, answers:{}, undoable:d.undoable, history:[] };
      S.undoable = d.undoable;
      forget("derived"); forget("plan"); forget("consequences");
      render(); refreshCli();
    }, showErr);
}
function doUndo(){
  api("/api/p/" + P() + "/config/undo", { method:"POST", body:{} }).then(function(d){
    forget("config"); forget("derived"); forget("plan"); forget("consequences"); forget("pins");
    S.undoable = d.undoable || "";
    S.toast = "undone: " + d.kind;
    render(); setTimeout(function(){ S.toast = ""; render(); }, 1400);
  }, showErr);
}
function measureLoad(){
  api("/api/p/" + P() + "/measure-load", { method:"POST", body:{} }).then(function(d){
    var cur = (S.data["config"] || {}).config;
    if (!cur) return;
    var next = JSON.parse(JSON.stringify(cur));
    Object.keys(d.rails || {}).forEach(function(r){
      if (!next.my_load[r]) next.my_load[r] = { on_a: 0, off_a: 0, switches: true };
      next.my_load[r].on_a = d.rails[r].on_a;
      if (!next.my_load[r].off_a) next.my_load[r].off_a = d.rails[r].off_a_suggested;
    });
    putConfig(next, "loads measured from the netlist");
  }, showErr);
}

/* ---------------------------------------------------------------- Plan -- */
SCREENS.plan = {
  cli: function(){
    var p = S.data["plan"] || {};
    return { ticks: p.ticks || {}, engine: "" };
  },
  main: function(){
    if (!S.project) return noProject();
    var pl = need("plan", "/api/p/" + P() + "/plan", "plan");
    if (S.errs.plan && pl === undefined){
      return '<div class="col grow">' + errBlock("plan")
           + panel("What will run, and why", "", emptyBlock("No plan yet",
               "Finish the three questions on New. The plan is computed from them and from the "
               + "model spec; there is nothing to fill in here.", "Go to New", "new")) + "</div>";
    }
    if (pl === undefined){
      return '<div class="col grow">' + panel("What will run, and why", "",
        loadingBlock("plan", "compiling the plan: merging the runs one simulation can share")) + "</div>";
    }
    var cost = pl.cost || {};
    var stats = '<div class="pb" style="display:flex;padding:12px 16px;flex-wrap:wrap">'
      + stat(pl.cells, "cells") + stat(cost.runs, "runs")
      + stat(num(cost.cpu_hours, 1), "CPU-h est.") + stat(pl.cached, "cached")
      + stat((pl.groups || []).filter(function(g){ return g.enabled; }).length + "/" + (pl.groups || []).length, "groups on")
      + '<div style="margin-left:auto;align-self:center" class="hint">Groups merge runs by AC '
      + "superposition; nothing here is simulated twice. Runs already in the ledger are skipped.</div></div>";
    var rows = (pl.groups || []).map(function(g){
      var ctx = regCtx({ row: g });
      var sel = S.sel.group === g.id;
      var pick = regAction(function(){ S.sel.group = g.id; render(); });
      var tick = regAction(function(){ setTick(g.id, !g.enabled); });
      return "<tr" + rc("group", g.id, ctx) + ' class="click rc' + (sel ? " sel" : "") + '">'
        + '<td><input type="checkbox" data-act="' + tick + '"' + (g.enabled ? " checked" : "") + "></td>"
        + '<td class="mono" data-act="' + pick + '" style="' + (g.enabled ? "" : "text-decoration:line-through;color:var(--ink3)")
        + '">' + esc(g.id) + "</td>"
        + '<td data-act="' + pick + '">' + esc(g.title) + "</td>"
        + '<td class="mono" style="color:var(--ink2)">' + esc((g.ports || []).join(", ")) + "</td>"
        + '<td class="num">' + g.runs + "</td>"
        + '<td class="num">' + (g.cached || 0) + "</td>"
        + '<td class="mono" style="font-size:11.5px">' + esc((g.observables || []).join(" ")) + "</td>"
        + '<td class="num">' + num(g.cpu_hours, 1) + "</td></tr>";
    }).join("");
    var table = panel("What will run, and why", "click a row for the reason &middot; untick to see what you lose",
      '<table class="t"><thead><tr><th style="width:26px"></th><th>Group</th><th>Analysis</th>'
      + '<th>Ports</th><th class="num">Runs</th><th class="num">Cached</th><th>Feeds</th>'
      + '<th class="num">CPU-h</th></tr></thead><tbody>' + rows + "</tbody></table>", { flush: true });
    var g = (pl.groups || []).filter(function(x){ return x.id === S.sel.group; })[0] || (pl.groups || [])[0];
    var detail = g ? planDetail(g) : panel("Select a group", "", '<div class="hint">Click a row.</div>');
    var cons = planConsequences(pl);
    return '<div class="col grow">' + errBlock("plan") + jobBlock()
         + '<div class="panel" style="flex:none">' + stats + "</div>" + table + "</div>"
         + '<div class="col" style="flex:0 0 460px">' + detail + cons + "</div>";
  },
  foot: function(){
    var pl = S.data["plan"] || {};
    var n = (pl.cost || {}).runs || 0;
    var sid = regAction(function(){ doSubmit(); });
    var block = submitBlocker(S.data["site"]);
    return '<span class="hint">Resume: runs already in the ledger are skipped. Nothing is '
         + "submitted until you press this.</span>"
         + '<div class="rowflex">' + runDestination() + '<button class="btn" data-act="' + regAction(function(){
             copy(((S.data["plan"] || {}).groups || []).map(function(g){
               return [g.id, g.analysis, g.runs, g.cpu_hours].join(","); }).join("\n"));
           }) + '">Export plan (CSV)</button>'
         + '<button class="btn" title="Write every run into the ledger without submitting one: '
         + 'the netlists and recipes exist, nothing is queued." data-act="'
         + regAction(function(){ doSubmit(true); }) + '">Dry run</button>'
         + (block ? '<span class="hint" style="color:var(--warn)">' + ICON.warn + " " + esc(block) + "</span>" : "")
         + '<button class="btn pri" data-act="' + sid + '"' + (n && !block ? "" : " disabled")
         + (block ? ' title="' + esc(block) + '"' : "") + ">"
         + ICON.play + " Submit " + n + " runs</button></div>";
  }
};
function stat(v, l){
  return '<div class="stat"><span class="v">' + esc(v === undefined || v === null ? "-" : v)
       + '</span><span class="l">' + esc(l) + "</span></div>";
}
function planDetail(g){
  var tab = S.sel.planTab || "why";
  var right = '<div class="rowflex"><button class="chip' + (tab === "why" ? " on" : "")
    + '" data-act="' + regAction(function(){ S.sel.planTab = "why"; render(); }) + '">Why</button>'
    + '<button class="chip' + (tab === "runs" ? " on" : "") + '" data-act="'

function recipeCode(rec){
  var body = (rec.lines || []).map(function(l){
    var cls = l.mark === "+" ? "a" : l.mark === "~" ? "e" : l.mark === "-" ? "d" : l.mark === "#" ? "c" : "";
    return '<span class="' + cls + '">' + esc(l.text) + "</span>";
  }).join("\n");
  return '<div class="code" style="max-height:230px">' + body + "</div>";
}
function consequenceOf(g){
  var cs = (S.data["consequences"] || {}).consequences || [];
  var hit = cs.filter(function(c){ return (g.ports || []).indexOf(c.port) >= 0; });
  if (hit.length) return hit.map(function(c){ return c.port + " " + c.block + ": " + c.effect; }).join(" ");
  return (g.ports || []).join(", ") + " would lose " + (g.observables || []).join(", ")
       + ", and every block fed by it is reported NOT RUN.";

         + "<span>Every block in the model spec has its data. Nothing will be reported NOT RUN.</span></div>";

    body = cs.consequences.map(function(c){
      return '<div class="callout bad" style="margin-bottom:8px">' + ICON.x + " <b class=\"mono\">"
           + esc(c.port) + "." + esc(c.block) + "</b> &mdash; " + esc(c.effect) + "</div>";

function submitBlocker(s){

/* The Donau account runs are charged to. The list lives in the box's site.json (never in the
   repo), edited on the Settings screen. The pick is remembered there too. */
function accountPicker(){
  var s = need("site", "/api/site", "plan");
  if (!s || s.engine !== "donau_alps") return "";
  var accs = s.accounts || [];
  if (!accs.length) return '<span class="hint">&middot; no Donau account yet</span>';
  var cur = s.account || "";
  var opts = (cur && !accs.some(function(a){ return a.name === cur; }))
    ? '<option value="' + esc(cur) + '" selected>' + esc(cur) + "</option>" : "";
  opts += (cur ? "" : '<option value="" selected disabled>choose a Donau account</option>');
  opts += accs.map(function(a){
    return '<option value="' + esc(a.name) + '"' + (a.name === cur ? " selected" : "") + ">"
         + esc(a.name) + (a.note ? " — " + esc(a.note) : "") + "</option>";
  }).join("");
  var id = regAction(function(v){ saveSite({ account: v }); });
  return '<span class="hint">&middot; account</span><select class="inp mono" data-change="' + id
       + '" title="dsub -A: the Donau account these runs are charged to">' + opts + "</select>";
}
function doSubmit(commitOnly){
  var s = S.data["site"] || {};
  if (!commitOnly && s.engine === "donau_alps" && !s.account){
    showErr({ error: { what: "no Donau account is selected.",
      why: "dsub -A names the account a job is charged to; Donau rejects a submit without one.",
      do: ["Pick one in the Account list next to Submit",
           "Or add one in Settings"],
      where: "Plan > Account" } });
    return;
  }
  /* Straight to Run as soon as the job exists: the ledger there refreshes while it works. */
  startJob(api("/api/p/" + P() + "/submit", { method:"POST",
      body:{ commit_only: !!commitOnly, account: s.account || "" } }),
    commitOnly ? "writing the ledger (nothing submitted)" : "submitting the plan",
    function(){ if (S.screen === "run") refreshRun(); },
    function(){ forget("ledger"); forget("run:"); go("run"); });
}

function hoverChart(node){
  var svg = node.querySelector("svg");

  var c = ctx.curve;

    var r = svg.getBoundingClientRect();
    var frac = (e.clientX - r.left) / r.width;
    var W = 520, X0 = 52, X1 = W - 8;
    var px = frac * W;
    var t = (px - X0) / (X1 - X0);
    if (t < 0 || t > 1){ box.style.display = "none"; svg.querySelector(".hov").innerHTML = ""; return; }
    var lg = c.x_log !== false;
    var f0 = lg ? Math.log10(c.x[0]) : c.x[0];
    var f1 = lg ? Math.log10(c.x[c.x.length - 1]) : c.x[c.x.length - 1];
    var target = f0 + t * (f1 - f0);
    var i = 0, best = Infinity;
    for (var k = 0; k < c.x.length; k++){

    var g = c.gt.mag[i], m = c.model.mag[i];
    var db = curveDelta(c, g, m) + (c.y_log === false ? "" : " dB");

    box.textContent = (lg ? eng(c.x[i], "Hz") : num(c.x[i], 1) + " C")
      + "   GT " + (g === null ? "-" : g.toPrecision(4))
      + "   model " + (m === null ? "-" : m.toPrecision(4)) + "   " + db;
    var xv = X0 + (X1 - X0) * ((lg ? Math.log10(c.x[i]) : c.x[i]) - f0) / (f1 - f0);

      + '" y1="12" y2="184" stroke="var(--ink3)" stroke-dasharray="3 3"/>';

      var tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map(function(t){ return "<li>" + mdInline(t) + "</li>"; }).join("")
        + "</" + tag + ">");
      continue;
    }
    if (!ln.trim()){ flush(); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flush();
  return out.join("");
}

SCREENS.digest = {
  cli: function(){
    return { budget: S.sel.budget || 64000,
             blocks: Object.keys(S.sel.dblocks || {}).filter(function(k){ return S.sel.dblocks[k]; }) };
  },
  main: function(){
    if (!S.project) return noProject();
    var d = need("digest", "/api/p/" + P() + "/digest/blocks", "digest");
    if (d === undefined && S.errs.digest) return '<div class="col grow">' + errBlock("digest") + "</div>";
    if (d === undefined) return '<div class="col grow">' + panel("What goes across", "",
      loadingBlock("digest", "rendering every block to measure it")) + "</div>";
    if (!d.blocks.length) return '<div class="col grow">' + panel("What goes across", "",
      emptyBlock("Nothing to send yet", "A digest carries the ledger, the parameters and the "
        + "curves. This project has none of them yet.", "Go to Run", "run")) + "</div>";
    if (!S.sel.dblocks){
      S.sel.dblocks = {};
      d.blocks.forEach(function(b){ S.sel.dblocks[b.id] = !!b.included_by_default; });
    }
    var budget = S.sel.budget || (d.budgets || [64000])[1] || 64000;
    var chosen = d.blocks.filter(function(b){ return S.sel.dblocks[b.id]; })
      .slice().sort(function(a, b){ return a.priority - b.priority; });
    var acc = 0, kept = {};
    chosen.forEach(function(b){ if (acc + b.bytes <= budget){ acc += b.bytes; kept[b.id] = true; } });
    var totalSel = chosen.reduce(function(a, b){ return a + b.bytes; }, 0);
    var dropped = chosen.filter(function(b){ return !kept[b.id]; });
    var rows = d.blocks.map(function(b){
      var on = !!S.sel.dblocks[b.id];
      var fate = !on ? "off" : kept[b.id] ? "kept" : "dropped";
      var ctx = regCtx({ row: b,
        only: function(){ var o = {}; d.blocks.forEach(function(x){ o[x.id] = x.priority <= 1 || x.id === b.id; });
                          S.sel.dblocks = o; forget("digesttext"); render(); },
        all: function(){ var o = {}; d.blocks.forEach(function(x){ o[x.id] = true; });
                         S.sel.dblocks = o; forget("digesttext"); render(); } });
      var id = regAction(function(){
        S.sel.dblocks[b.id] = !on; forget("digesttext"); render(); refreshCli(); });
      return '<tr class="rc"' + rc("digest", b.title, ctx) + ">"
        + '<td><input type="checkbox" data-act="' + id + '"' + (on ? " checked" : "") + "></td>"

        + '<td class="num">' + (b.bytes / 1000).toFixed(1) + "</td>"
        + '<td><span class="badge b-' + (fate === "kept" ? "ok" : fate === "dropped" ? "warn" : "mute")
        + '">' + fate + "</span></td></tr>";
    }).join("");
    var budgets = (d.budgets || []).map(function(b){
      return '<button class="chip' + (budget === b ? " on" : "") + '" data-act="'
        + regAction(function(){ S.sel.budget = b; forget("digesttext"); render(); refreshCli(); })
        + '">' + Math.round(b / 1000) + " KB</button>";
    }).join(" ");
    var left = panel("What goes across", "",
      '<table class="t"><thead><tr><th style="width:26px"></th><th>Block</th>'
      + '<th class="num">KB</th><th>Fate</th></tr></thead><tbody>' + rows + "</tbody></table>"
      + '<div style="padding:10px 13px;border-top:1px solid var(--line2)">'
      + '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">'
      + '<span><b class="mono">' + (totalSel / 1000).toFixed(1) + ' KB</b> selected &middot; <b class="mono">'
      + (acc / 1000).toFixed(1) + " KB</b> fits in " + Math.round(budget / 1000) + " KB</span>"
      + '<span class="hint">' + (acc > 32000 ? "split into " + Math.ceil(acc / 32000) + " parts" : "one paste")
      + "</span></div>"
      + '<div class="bar"><div class="seg" style="background:var(--acc);width:'
      + (100 * acc / Math.max(totalSel, 1)).toFixed(1) + '%"></div>'
      + '<div class="seg" style="background:var(--warn);width:'
      + (100 * (totalSel - acc) / Math.max(totalSel, 1)).toFixed(1) + '%"></div></div>'
      + '<div class="hint" style="margin-top:6px">Over budget, the lowest-priority blocks drop first '
      + "and are <b>named in the trailer</b>. Never a silent cut.</div></div>",
      { flush: true, right: '<div class="rowflex"><span class="hint">budget</span>' + budgets + "</div>" });
    var txt = S.data["digesttext"];
    var gen = regAction(function(){
      api("/api/p/" + P() + "/digest", { method:"POST", body:{

        .then(function(r){ S.data["digesttext"] = r; render(); }, showErr);

    var right = panel("Preview", "",
      txt ? '<div class="code" style="max-height:48vh">' + esc(txt.text) + "</div>"
          + '<div class="hint" style="margin-top:8px">' + txt.parts.length + " part(s), " + txt.bytes
          + " bytes" + (txt.dropped.length ? " &middot; dropped: " + esc(txt.dropped.join(", ")) : "")
          + "</div>"
        : '<div class="empty"><div class="t">Nothing rendered yet</div>'
          + "<div>Pick the blocks and a budget, then render the text you will paste.</div>"
          + '<button class="btn" style="margin-top:6px" data-act="' + gen + '">Render the digest</button></div>',
      { right: txt ? '<div class="rowflex"><button class="btn sm" data-act="'
          + regAction(function(){ copy(txt.text); }) + '">' + ICON.copy + " Copy</button>"
          + '<button class="btn sm" data-act="' + gen + '">Re-render</button></div>' : "" });
    var imp = panel("On the desk", "the other half of this feature",
      '<div class="code wrap">' + esc(
        "pmukit digest import digest_" + S.project + ".txt   # rebuilds a dataset subset + params\n"
        + "pmukit reproduce " + S.project + " --from-digest      # refits and diffs every number\n"
        + "pmukit report " + S.project + " --cell ss/25c         # the same report text as the box")
      + "</div>"
      + '<div class="rowflex" style="margin-top:8px"><textarea class="inp" id="impbox" '
      + 'style="height:64px;width:100%;font-family:var(--mono);padding:6px" '
      + 'placeholder="paste a digest here to import it"></textarea></div>'
      + '<button class="btn sm" style="margin-top:6px" data-act="' + regAction(function(){
          var t = el("impbox").value;
          api("/api/digest/import", { method:"POST", body:{ text: t } })
            .then(function(r){ S.sel.imported = r; render(); }, showErr);
        }) + '">Import this digest</button>'
      + (S.sel.imported ? '<div class="code wrap" style="margin-top:8px;max-height:150px">'
          + esc(JSON.stringify(S.sel.imported, null, 1)) + "</div>" : ""),
      { style: "flex:none" });
    return '<div class="col" style="flex:0 0 600px">' + errBlock("digest") + jobBlock()
         + panel("Copy for desk", "",
             '<div class="hint">The box has no agent and no network. This packs what a desk debugger '
             + "needs into <b>plain text you paste through the relay</b>. Numbers are lossless; "
             + "curves are resampled and say so. Nothing crosses git.</div>", { style: "flex:none" })
         + left + "</div>"

         + "machines, never in git.</span>"
         + '<button class="btn pri"' + (txt ? ' data-act="' + regAction(function(){ copy(txt.text); }) + '"' : " disabled")
         + ">" + ICON.copy + " Copy the digest</button>";
  }
};

function saveSite(body, after){
