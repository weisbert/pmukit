  main: function(){
    var demoErr = { what: "Netlist rejected: 2 pins have no role.",
      why: "pmukit tells rails from biases only by the source-name prefix; it never guesses.",
      do: ["Rename the sources (IL_VDD0P8_A, VB_IB_PTAT) and export again",
           "Or right-click the pin and set its role by hand"],
      where: "tb/input.scs lines 41, 57" };
    var eid = regAction(function(){});
    return '<div class="col grow" style="min-width:100%"><div style="display:grid;'
      + 'grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">'
      + panel("New &middot; error state", "", (function(){
          var saved = S.errs.states;
          S.errs.states = { status: 400, error: demoErr, retry: function(){} };
          var html = errBlock("states");
          S.errs.states = saved;
          return html + '<div class="hint">Four parts, always: what happened, why, what to do, '
               + "where to look. The pin table stays on screen so the fix is one right-click away.</div>";
        })())
      + panel("New &middot; loading state", '<span class="badge b-acc">parsing</span>',
          '<div class="hint">Parsing <span class="mono">tb/input.scs</span>, 41 KB, resolving 10 pins</div>'
          + skeleton(4, "") + '<div class="hint">Skeleton rows in the shape of the table that will '
          + "appear; no spinner-only screens. Anything longer than 2 s says what it is doing.</div>")
      + panel("Plan &middot; empty state", '<span class="badge b-mute">nothing to plan</span>',
          emptyBlock("No plan yet", "Finish the three questions on New. The plan is computed from "
            + "them and from the model spec; there is nothing to fill in here.", "Go to New", "new"))
      + panel("Run &middot; error state", '<span class="badge b-bad">queue unreachable</span>',
          '<div class="callout bad"><b>Cannot submit: dsub is not answering.</b> The planned runs '
          + "are written to disk but none was submitted. <span class=\"mono\">dsub --json</span> "
          + "timed out after 30 s. Retry when the scheduler is back; the ledger resumes exactly "
          + "where it stopped.</div>"
          + '<div class="hint" style="margin-top:8px">Sibling errors with the same shape: licence '
          + "not found, PDK directory missing, ahdl compile failed, disk full.</div>")
      + panel("Model &middot; empty state", '<span class="badge b-mute">not fitted</span>',
          '<div class="empty"><div class="t">Model not fitted yet</div><div>191 of 282 runs are '
          + "done. The fit needs every DC and AC group complete; noise and transients can arrive "
          + "later and refine it.</div></div>")
      + panel("Deliver &middot; partial state", '<span class="badge b-warn">with reservations</span>',
          '<div class="callout warn"><b>This deliverable carries 1 NOT RUN block and 1 MARG cell.</b> '
          + "Both are printed in report.md and in every .va header. Deliver anyway, or go back and "
          + "retry the missing run.</div>"
          + '<div class="hint" style="margin-top:8px">Nothing is blocked silently; nothing is '
          + "hidden. The user decides, the report remembers.</div>")
      + "</div></div>";
  },
  foot: function(){
    return '<span class="hint">State sheet: how each screen looks when empty, loading, failing or '
         + "partial. The message grammar is fixed: what, why, do, where.</span>"
         + '<span class="hint">not a step &middot; reference for the build</span>';
  }
};

/* ------------------------------------------------------ command palette -- */
function paletteCommands(){
  var cmds = STEPS.map(function(s){
    return { label: "Go to " + s[1], hint: "key " + s[0], run: function(){ go(s[2]); } };
  });
  cmds.push({ label: "Copy for desk (digest)", hint: "4b", run: function(){ go("digest"); } });
  cmds.push({ label: "Screen states reference", hint: "states", run: function(){ go("states"); } });
  cmds.push({ label: "Help for this screen", hint: "?", run: function(){ openHelp(); } });
  cmds.push({ label: "Undo the last configuration change", hint: "Ctrl Z", run: function(){ doUndo(); } });
  cmds.push({ label: "Copy the command echo", hint: "$", run: function(){ copy(S.cli); } });
  cmds.push({ label: "Reload everything from the server", hint: "cache", run: function(){
    S.data = {}; S.loading = {}; render(); } });
  if (S.project){
    cmds.push({ label: "Fit the model", hint: S.project, run: function(){ doFit(); } });
    cmds.push({ label: "Verify (HB health check)", hint: S.project, run: function(){ doVerify(); } });
    cmds.push({ label: "Write the deliverable", hint: S.project, run: function(){ doDeliver(); } });
    cmds.push({ label: "Submit the plan", hint: S.project, run: function(){ doSubmit(); } });
    cmds.push({ label: "Open report", hint: "report.md of the latest deliverable", run: function(){ openReport(); } });
  }
  cmds.push({ label: "Settings: engine, queue, Donau accounts", hint: "this machine", run: function(){ go("settings"); } });
  cmds.push({ label: "New project", hint: "Home", run: function(){ newProject(""); } });
  var q = (S.paletteQ || "").trim();
  if (/^[0-9a-f]{6,}$/i.test(q)){
    cmds.unshift({ label: "Open run " + q, hint: "run id", run: function(){
      S.sel.run = q; forget("run:"); go("run"); } });
  }
  return cmds;
}

/* --------------------------------------------------------------- keys --- */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "Escape"){
    if (S.palette){ S.palette = false; S.paletteQ = ""; render(); return; }
    if (S.menu){ S.menu = null; render(); return; }
    if (S.help){ S.help = null; render(); return; }
    if (S.errs[S.screen]){ delete S.errs[S.screen]; render(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault(); S.palette = true; S.paletteQ = ""; render(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
    e.preventDefault(); primary(); return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")){
    if (typing) return;
    e.preventDefault();
    if (S.project) doUndo();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "?"){ e.preventDefault(); openHelp(); return; }
  if (e.key >= "0" && e.key <= "5"){
    var s = STEPS[Number(e.key)];
    if (s){ e.preventDefault(); go(s[2]); }
    return;
  }
});
function primary(){
  if (S.screen === "new") return go("plan");
  if (S.screen === "plan") return doSubmit();
  if (S.screen === "run") return doFit();
  if (S.screen === "model") return doDeliver();
  if (S.screen === "deliver") return doDeliver();
  if (S.screen === "digest"){
    var t = S.data["digesttext"];
    if (t) return copy(t.text);
  }
  if (S.screen === "home") return S.sel.newName ? createProject() : newProject("");
}
document.addEventListener("click", function(){ if (S.menu){ S.menu = null; render(); } });
document.addEventListener("contextmenu", function(e){
  /* Objects opt in through data-menu; anywhere else keeps the browser's own menu suppressed
     inside the app frame so a stray right-click does not look like a dead zone. */
  if (e.target && e.target.closest && e.target.closest("[data-menu]")) return;
  if (e.target && e.target.closest && e.target.closest(".app")) e.preventDefault();
});
/* drag and drop a netlist anywhere on the New screen */
document.addEventListener("dragover", function(e){
  if (S.screen !== "new") return;
  e.preventDefault();
  var d = el("drop"); if (d) d.classList.add("over");
});
document.addEventListener("dragleave", function(){ var d = el("drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", function(e){
  if (S.screen !== "new" || !S.project) return;
  e.preventDefault();
  var d = el("drop"); if (d) d.classList.remove("over");
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){ loadNetlist({ text: String(rd.result), name: f.name }); };
  rd.readAsText(f);
});
/* back from Virtuoso: ask again whether the exported netlist changed on disk since the read */
window.addEventListener("focus", function(){
  if (S.screen !== "new" || !S.project || S.demo || !S.data["netlistsrc"]) return;
  if (S.job && S.job.status === "running") return;
  forget("netlistsrc"); render();
});

/* ---------------------------------------------------------------- boot -- */
/* The project to open on: ?project= in the URL, else the one `pmukit open <project>` handed the
   server (so a bare URL still lands there). A named project opens at the screen it was left on,
   unless ?screen= says otherwise; with none named, Home selects the first row. */
function boot(){
  var q = new URLSearchParams(window.location.search);
  if (q.get("project")) S.project = q.get("project");
  if (q.get("screen")) S.screen = q.get("screen");
  render();
  refreshCli();
  api("/api/projects").then(function(d){
    S.demo = !!d.demo;
    S.data["projects"] = d;
    var named = S.project || d.initial_project || "";
    if (named){
      S.project = named; S.sel.project = named;
      if (!q.get("screen")){
        api("/api/state/" + P()).then(function(st){
          if (S.screen === "home" && st.screen && SCREENS[st.screen]) go(st.screen);
        }, function(){});
      }
    } else if (d.projects && d.projects.length){
      S.sel.project = d.projects[0].name;
      S.project = d.projects[0].name;
    }
    render();
    refreshCli();
  }, function(){ render(); });
  setInterval(function(){
    if (S.screen === "run" && runLive()) refreshRun();
  }, RUN_REFRESH_MS);
}
boot();
</script>
